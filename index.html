<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Návyky">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Habit Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%85%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --muted:#8a8a8e; --line:#e4e4e9;
  --text-bg:#1c1c1e; --muted-bg:#8a8a8e; --field-bg:#ececf1;
  --accent:#0a84ff; --green:#34c759; --green-soft:rgba(52,199,89,.13); --red:#ff3b30;
  --btn-bg:#e9e9ee;
  --h0:#e4e4e9; --h1:#9be9a8; --h2:#40c463; --h3:#30a14e; --h4:#216e39;
  --shadow:0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  --radius:16px;
  --tabbar-bg:rgba(249,249,251,.88);
  --accent-text:#ffffff; --accent-soft:rgba(10,132,255,.38); --accent-ring:rgba(10,132,255,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
[hidden]{display:none !important;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--bg); color:var(--text-bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px; line-height:1.45;
}
body.no-scroll{overflow:hidden;}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;}
button:disabled{opacity:.35;cursor:default;}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px;}
input{font-family:inherit;color:var(--text);}
input,textarea{-webkit-appearance:none;appearance:none;}

#app{
  max-width:680px;margin:0 auto;
  padding:10px calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}

/* ---------- hlavička aplikace ---------- */
.app-top{padding:6px 2px 10px;display:flex;align-items:baseline;justify-content:space-between;}
.app-title{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-bg);}

#storage-banner{
  background:#fff3cd;color:#5c4400;border:1px solid #e8d48a;
  border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 12px;
}

/* ---------- navigace dne / týdne / měsíce ---------- */
.daynav{display:flex;align-items:center;gap:8px;margin:2px 0 14px;}
.daynav-mid{flex:1;text-align:center;min-width:0;}
.daynav-date{font-size:21px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.daynav-sub{font-size:13px;color:var(--muted-bg);margin-top:1px;}
.linklike{font-size:13px;color:var(--accent);min-height:24px;padding:2px 6px;border-radius:8px;}
.icon-btn{
  min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:12px;background:var(--card);color:var(--text);box-shadow:var(--shadow);
  font-size:22px;line-height:1;user-select:none;-webkit-user-select:none;
}
.icon-btn:active:not(:disabled){transform:scale(.94);}

/* ---------- karty ---------- */
.card{background:var(--card);color:var(--text);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;}
.card h3{margin:0 0 8px;font-size:16px;}
.card p{margin:0 0 12px;}
.card p:last-child{margin-bottom:0;}
.muted{color:var(--muted);font-size:14px;}
.empty{text-align:center;color:var(--muted);padding:28px 16px;}
.hint{font-size:12.5px;color:var(--muted-bg);margin:10px 2px 0;}
.sec-title{font-size:14px;font-weight:600;color:var(--muted-bg);margin:20px 4px 8px;text-transform:uppercase;letter-spacing:.06em;}
.view-title{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 2px 14px;}

/* ---------- denní progres ---------- */
.progress-card{padding:14px 16px;}
.progress-txt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px;margin-bottom:9px;}
.progress-txt .muted{font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto;}
.bar{height:8px;border-radius:4px;background:var(--btn-bg);overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;background:var(--green);transition:width .3s ease;}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:8px;justify-content:flex-end;margin:0 0 12px;}
.btn{
  min-height:44px;padding:0 16px;border-radius:12px;background:var(--card);color:var(--text);
  box-shadow:var(--shadow);font-size:15px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  user-select:none;-webkit-user-select:none;
}
.btn:active{transform:scale(.97);}
.btn.small{font-size:14.5px;padding:0 14px;}
.btn.primary{background:var(--accent);color:var(--accent-text);}
.btn.danger{background:var(--red);color:#fff;}
.btn.ghost{background:var(--btn-bg);box-shadow:none;}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;}
.row-btns .btn{flex:1;min-width:150px;background:var(--btn-bg);box-shadow:none;}

/* ---------- řádky návyků ---------- */
.habit-list{display:flex;flex-direction:column;gap:8px;}
.habit-row{
  display:flex;align-items:center;gap:12px;
  background:var(--card);color:var(--text);border-radius:var(--radius);
  padding:10px 14px;min-height:62px;box-shadow:var(--shadow);
  user-select:none;-webkit-user-select:none;
  transition:background .2s ease, transform .12s ease;
}
.habit-row.check{cursor:pointer;}
.habit-row.check:active{transform:scale(.985);}
.habit-row.done{background:var(--green-soft);}
.h-emoji{
  width:34px;height:34px;flex:0 0 34px;display:inline-flex;align-items:center;justify-content:center;
  font-size:23px;line-height:1;
}
.h-emoji.letter{background:var(--btn-bg);border-radius:50%;font-size:16px;font-weight:700;color:var(--muted);}
.pop-wrap{display:inline-flex;}
.h-main{flex:1;min-width:0;}
.h-name{font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.h-sub{font-size:13px;color:var(--muted);margin-top:1px;}
.h-meta{display:flex;align-items:baseline;gap:10px;margin-top:1px;min-width:0;}
.h-streak{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
.h-streak.zero{opacity:.45;}
.h-goal{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-bar{height:4px;border-radius:2px;background:var(--btn-bg);margin-top:7px;overflow:hidden;}
.mini-bar span{display:block;height:100%;border-radius:2px;background:var(--green);}

/* zaškrtávací kolečko */
.checkbox{
  width:30px;height:30px;flex:0 0 30px;border-radius:50%;
  border:2.2px solid var(--line);display:flex;align-items:center;justify-content:center;
  transition:background .18s ease, border-color .18s ease;
}
.habit-row.done .checkbox{background:var(--green);border-color:var(--green);}
.checkbox svg{width:17px;height:17px;display:block;}
.checkbox svg path{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:0;}
.pop{animation:pop .38s cubic-bezier(.3,1.7,.5,1);}
.pop svg path{animation:draw .32s ease .04s both;}
@keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.28);}100%{transform:scale(1);}}
@keyframes draw{from{stroke-dashoffset:26;}to{stroke-dashoffset:0;}}

/* číselný stepper */
.stepper{display:flex;align-items:center;gap:2px;flex:0 0 auto;}
.step-btn{
  width:44px;height:44px;border-radius:12px;background:var(--btn-bg);
  font-size:22px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;
}
.step-btn:active{transform:scale(.92);}
.num-input{
  width:56px;height:44px;text-align:center;font-size:17px;font-weight:700;
  background:transparent;border:0;font-variant-numeric:tabular-nums;
  border-radius:10px;
}
.num-input:focus-visible{outline:2px solid var(--accent);}

/* režim úprav */
.habit-row.edit{cursor:grab;}
.habit-row.edit:active{cursor:grabbing;}
.habit-row.dragging{opacity:.4;}
.habit-row.drag-over{outline:2px dashed var(--accent);outline-offset:2px;}
.drag-handle{color:var(--muted);font-size:17px;flex:0 0 auto;letter-spacing:-2px;}
.edit-controls{display:flex;gap:2px;flex:0 0 auto;}
.edit-controls .icon-btn{box-shadow:none;background:transparent;font-size:18px;min-width:42px;}
.habit-row.archived{opacity:.75;}
@media (max-width:540px){
  .habit-row.edit .drag-handle{display:none;}
  .habit-row.edit{padding-left:10px;padding-right:6px;gap:8px;}
  .edit-controls .icon-btn{min-width:40px;}
}

/* ---------- týdenní mřížka ---------- */
.grid-card{padding:10px 6px 12px;}
.wk-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.wk-grid{display:grid;gap:2px 2px;align-items:center;min-width:100%;}
.wk-cell{
  min-height:46px;display:flex;align-items:center;justify-content:center;
  font-size:13px;
}
.wk-cell.name{
  position:sticky;left:0;z-index:1;background:var(--card);
  justify-content:flex-start;gap:5px;padding:0 6px;min-width:0;
}
.wk-cell.name .h-emoji{width:22px;height:22px;flex:0 0 22px;font-size:15px;}
.wk-cell.name .h-emoji.letter{font-size:12px;}
.wk-hname{
  flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  font-weight:500;font-size:12.5px;line-height:1.25;
}
.wk-head{flex-direction:column;gap:0;line-height:1.15;border-radius:10px;}
.wk-head span:first-child{font-size:12px;font-weight:700;color:var(--muted);}
.wk-dnum{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
.wk-head.today{background:var(--green-soft);}
.wk-head.today span{color:var(--green);}
.wk-dot{
  width:100%;max-width:46px;height:44px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:12px;font-size:15px;font-weight:700;color:transparent;
}
.wk-dot::before{content:"";position:absolute;}
.wk-dot{position:relative;}
.wk-dot::after{
  content:"";width:26px;height:26px;border-radius:50%;
  border:2px solid var(--line);position:absolute;
  transition:background .15s ease,border-color .15s ease;
}
.wk-dot.on{color:#fff;}
.wk-dot.on::after{background:var(--green);border-color:var(--green);}
.wk-dot span,.wk-dot{z-index:0;}
.wk-dot.on{z-index:0;}
.wk-dot.on{font-size:14px;}
.wk-dot.on{color:#fff;}
.wk-dot.on{text-shadow:none;}
.wk-dot > *{position:relative;z-index:1;}
.wk-num{
  min-width:0;width:100%;max-width:46px;height:44px;border-radius:12px;font-size:12px;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--muted);background:transparent;
  display:inline-flex;align-items:center;justify-content:center;padding:0 1px;
}
.wk-num.part{background:var(--btn-bg);color:var(--text);}
.wk-num.on{background:var(--green);color:#fff;}
.wk-cell.sum{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;border-top:1px solid var(--line);min-height:38px;}
.wk-cell.name.sum{font-weight:600;}

/* ---------- měsíční heatmapa ---------- */
.hm-week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px;}
.hm-wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);}
.hm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.hm{
  aspect-ratio:1/1;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;
  background:var(--h0);color:var(--text);width:100%;
}
.hm.blank{background:transparent;}
.hm.future{background:transparent;border:1.5px dashed var(--line);color:var(--muted);}
.hm.l1{background:var(--h1);}
.hm.l2{background:var(--h2);}
.hm.l3{background:var(--h3);color:#fff;}
.hm.l4{background:var(--h4);color:#fff;}
.hm.l1,.hm.l2{color:#0b3d1c;}
.hm.l3,.hm.l4{color:#ffffff;}
.hm.today{box-shadow:inset 0 0 0 2.5px var(--accent);}
.hm-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:8px;}
.hm-legend{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);}
.hm-legend .hm{width:15px;height:15px;aspect-ratio:auto;border-radius:4px;flex:0 0 auto;}
.hm-avg{font-size:13.5px;color:var(--muted);}

/* ---------- statistiky ---------- */
.stat-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px;}
@media (min-width:600px){.stat-cards{grid-template-columns:repeat(4,minmax(0,1fr));}}
.stat{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px 16px;min-width:0;
}
.stat-num{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap;}
.stat-lbl{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.3;}
.table-card{padding:8px 4px;overflow-x:auto;}
.stat-table{width:100%;border-collapse:collapse;font-size:14.5px;}
.stat-table th{
  text-align:left;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.stat-table td{padding:11px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
.stat-table tr:last-child td{border-bottom:0;}
.stat-table th:not(:first-child),.stat-table td:not(:first-child){text-align:right;}
.stat-table td:first-child{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tbl-emoji{margin-right:7px;}
.stat-table tr.dim{color:var(--muted);}

/* ---------- spodní lišta ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--tabbar-bg);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-inner{max-width:680px;margin:0 auto;display:flex;}
.tab-btn{
  flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:12px;font-weight:700;color:var(--muted-bg);white-space:nowrap;min-width:0;overflow:visible;
}
.tab-btn .tab-ico{font-size:22px;line-height:1.2;opacity:.55;transition:opacity .15s,transform .15s;}
.tab-btn.on{color:var(--accent);}
.tab-btn.on .tab-ico{opacity:1;transform:translateY(-1px);}
.tab-center{overflow:visible;}
.tab-day{
  width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-text);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;line-height:1;
  margin-top:-28px;border:4px solid var(--bg);flex:0 0 auto;
  box-shadow:0 6px 16px var(--accent-soft),0 2px 5px rgba(0,0,0,.18);
  transition:transform .12s ease,opacity .15s;
}
.tab-center:not(.on) .tab-day{opacity:.82;}
.tab-center:active .tab-day{transform:scale(.92);}
.tab-center .tab-lbl{font-weight:800;}
.tab-ghost{visibility:hidden;pointer-events:none;}

/* ---------- kompaktní telefonní režim ---------- */
@media (max-width:440px){
  .habit-row{padding:10px 12px;gap:10px;}
  .habit-row .h-emoji{width:30px;height:30px;flex:0 0 30px;font-size:21px;}
  .h-name{font-size:16px;}
  .step-btn{width:38px;height:42px;font-size:20px;}
  .num-input{width:46px;font-size:16px;}
  .stepper{gap:1px;}
  .edit-controls .icon-btn{min-width:34px;font-size:16px;}
  .stat-table th,.stat-table td{padding-left:7px;padding-right:7px;}
  .stat-table td:first-child{max-width:150px;}
  .view-title{font-size:24px;}
  .tab-btn{font-size:11px;}
}

/* ---------- modální okno ---------- */
.modal-wrap{position:fixed;inset:0;z-index:100;}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.42);}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:90vh;max-height:90dvh;overflow-y:auto;
  background:var(--card);color:var(--text);border-radius:22px 22px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  animation:sheetIn .28s cubic-bezier(.2,.9,.3,1);
}
@keyframes sheetIn{from{transform:translateY(36px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@media (min-width:600px){
  .sheet{
    left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);
    width:460px;border-radius:22px;padding-bottom:22px;
    animation:none;
  }
}
.sheet-title{margin:0 0 16px;font-size:21px;font-weight:800;letter-spacing:-.01em;}
.field{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:14px;}
.field-lbl{display:block;margin-bottom:7px;}
.field input{
  display:block;width:100%;margin-top:6px;
  min-height:46px;padding:10px 13px;font-size:17px;
  background:var(--field-bg);border:1px solid var(--line);border-radius:12px;
}
.field input:focus{border-color:var(--accent);outline:none;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.emoji-row{display:flex;gap:7px;flex-wrap:wrap;margin:-4px 0 16px;}
.emoji-pick{
  width:44px;height:44px;border-radius:12px;background:var(--field-bg);border:1px solid var(--line);
  font-size:22px;display:inline-flex;align-items:center;justify-content:center;
}
.emoji-pick:active{transform:scale(.9);}
.seg{display:flex;background:var(--field-bg);border:1px solid transparent;border-radius:12px;padding:3px;gap:3px;}
.seg.freq{flex-wrap:wrap;}
.seg.freq .seg-btn{flex:1 1 31%;}
.seg.freq{display:grid;grid-template-columns:1fr 1fr;}
.seg-btn{flex:1;min-height:42px;border-radius:9px;font-size:15px;font-weight:600;color:var(--muted);}
.seg.freq .seg-btn{font-size:14px;}
.seg-btn.on{background:var(--card);color:var(--text);box-shadow:var(--shadow);}
.day-picker{display:flex;gap:5px;}
.day-chip{flex:1;min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--field-bg);font-size:13.5px;font-weight:700;color:var(--muted);}
.day-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.wk-dot.off::after{border-style:dashed;opacity:.5;}
.wk-off{opacity:.45;}
.wk-hfreq{display:block;font-size:10.5px;font-weight:600;color:var(--muted);}
.wk-okwk{color:var(--green);}
.cal-seg{max-width:260px;margin:0 auto 12px;}
.hm.vacday{background:transparent;border:1.5px dashed var(--line);color:var(--muted);}
.vac-card{
  background:var(--card);color:var(--text);border-radius:var(--radius);box-shadow:var(--shadow);
  margin-top:26px;opacity:.92;
}
.vac-card summary{display:flex;align-items:center;gap:12px;padding:11px 14px;list-style:none;cursor:pointer;min-height:44px;}
.vac-card summary::-webkit-details-marker{display:none;}
.vac-emo{width:36px;height:36px;border-radius:11px;background:var(--field-bg);display:inline-flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto;}
.vac-sum{display:flex;flex-direction:column;gap:0;min-width:0;flex:1;line-height:1.3;}
.vac-sum strong{font-size:14px;}
.vac-sum span{font-size:12.5px;color:var(--muted);}
.vac-chev{color:var(--muted);font-size:19px;transition:transform .15s;flex:0 0 auto;padding-right:2px;}
.vac-card[open] .vac-chev{transform:rotate(90deg);}
.vac-list{list-style:none;margin:0;padding:2px 14px 12px;}
.vac-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;}
.vac-nm{display:inline-flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.vac-until{flex:0 0 auto;font-size:12.5px;color:var(--muted);}
.vac-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0 5px 2px;border-bottom:1px solid var(--line);font-size:15px;}
.vac-row:last-child{border-bottom:0;}
.vac-row .icon-btn{box-shadow:none;background:transparent;font-size:17px;min-width:40px;min-height:40px;}
.plan-text{font-size:15px;line-height:1.55;margin:0;word-break:break-word;}
.pl-p{margin:7px 0;}
.pl-p:first-child,.pl-li:first-child{margin-top:0;}
.pl-p:last-child,.pl-li:last-child{margin-bottom:0;}
.pl-li{display:flex;gap:9px;margin:6px 0;align-items:flex-start;font-size:15px;line-height:1.5;}
.pl-dot{flex:0 0 auto;color:var(--accent);font-weight:700;}
.pl-li.sub{margin-left:20px;font-size:14px;color:var(--text);}
.pl-li.sub .pl-dot{color:var(--muted);font-weight:400;}
.pl-tx{min-width:0;word-break:break-word;}
.pl-sp{height:9px;}
.pl-time{
  display:inline-block;background:var(--btn-bg);border-radius:7px;padding:1px 8px;margin-right:3px;
  font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.plan-head{font-size:17.5px;font-weight:800;letter-spacing:-.01em;margin:22px 4px 10px;}
.plan-head:first-child{margin-top:2px;}
details.plan-day{background:var(--card);color:var(--text);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:8px;padding:0 14px;}
details.plan-day.today{box-shadow:var(--shadow), inset 0 0 0 1.5px var(--green);}
.plan-day summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:54px;cursor:pointer;font-weight:600;font-size:15px;user-select:none;-webkit-user-select:none;}
.plan-day summary::-webkit-details-marker{display:none;}
.day-tag{flex:0 0 auto;min-width:36px;padding:5px 8px;border-radius:9px;color:#fff;font-size:12.5px;font-weight:800;text-align:center;letter-spacing:.02em;}
.day-tag.d0{background:#0a84ff;}.day-tag.d1{background:#5e5ce6;}.day-tag.d2{background:#af52de;}.day-tag.d3{background:#ff375f;}
.day-tag.d4{background:#ff9f0a;}.day-tag.d5{background:#30d158;}.day-tag.d6{background:#64d2ff;}
.plan-day-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.today-tag{flex:0 0 auto;font-size:10.5px;font-weight:800;color:var(--green);background:var(--green-soft);padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;}
.chev{flex:0 0 auto;color:var(--muted);transition:transform .18s ease;font-size:19px;line-height:1;}
details[open] > summary .chev{transform:rotate(90deg);}
.plan-day .plan-body{border-top:1px solid var(--line);padding:12px 2px 15px;font-size:15px;line-height:1.55;}
.plan-ta,.meal-ta{
  width:100%;min-height:56vh;min-height:56dvh;resize:vertical;display:block;
  border:1.5px solid var(--line);border-radius:12px;background:var(--field-bg);color:var(--text);
  font:inherit;font-size:16px;line-height:1.5;padding:12px;
}
.meal-ta{min-height:42vh;min-height:42dvh;}
.plan-ta:focus,.meal-ta:focus{border-color:var(--accent);outline:none;}
.meal-group{margin-bottom:16px;}
.meal-group:last-child{margin-bottom:2px;}
.meal-lbl{font-size:12.5px;font-weight:800;color:var(--muted);margin:0 2px 7px;text-transform:uppercase;letter-spacing:.06em;}
.meal-f{
  width:100%;display:block;border:1.5px solid var(--line);border-radius:12px;
  background:var(--field-bg);color:var(--text);font:inherit;font-size:16px;line-height:1.45;
  padding:10px 12px;resize:vertical;
}
.meal-f:focus{border-color:var(--accent);outline:none;}
textarea.meal-f{min-height:58px;}
input.meal-sn{min-height:46px;resize:none;margin-bottom:8px;}
.add-snack{width:100%;min-height:42px;font-size:14px;}
.meals-tools{display:flex;justify-content:flex-end;margin:0 0 6px;}
.meal-lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.hist-btn{
  min-width:36px;min-height:30px;border-radius:9px;background:var(--btn-bg);
  font-size:15px;display:inline-flex;align-items:center;justify-content:center;
}
.hist-btn:active{transform:scale(.92);}
.mh-list{max-height:52vh;max-height:52dvh;overflow-y:auto;margin:0 -4px;}
.mh-row{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 8px;border-bottom:1px solid var(--line);font-size:15px;text-align:left;
}
.mh-row:last-child{border-bottom:0;}
.mh-row:active{background:var(--btn-bg);}
.mh-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mh-n{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;}

/* ---------- přepínač splněných ---------- */
.pc-tools{display:flex;align-items:center;justify-content:flex-end;margin-top:10px;}
.pc-tools .linklike{white-space:nowrap;}

/* ---------- poznámky ---------- */
.note-dot{font-size:12px;opacity:.85;}
.hm{position:relative;}
.hm-nd{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--accent);}

/* ---------- zmrazení ---------- */
.wk-dot.frz::after{background:#5ac8fa;border-color:#5ac8fa;}
.wk-num.frz{color:#5ac8fa;font-weight:800;font-size:15px;}

/* ---------- časovač ---------- */
.tmr{box-shadow:none;background:var(--btn-bg);min-width:40px;min-height:40px;font-size:17px;flex:0 0 auto;}
.lnk{
  box-shadow:none;background:transparent;min-width:32px;min-height:40px;flex:0 0 auto;
  color:var(--muted);opacity:.7;font-weight:700;font-size:15px;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;border-radius:10px;
}
.lnk:active{opacity:1;background:var(--btn-bg);}
#timerpill{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));z-index:60;
  background:var(--accent);color:var(--accent-text);border-radius:999px;padding:8px 8px 8px 16px;
  display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;
  box-shadow:0 4px 16px rgba(0,0,0,.25);white-space:nowrap;max-width:92vw;
}
#timerpill[hidden]{display:none;}
#timerpill button{
  width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);color:var(--accent-text);
  display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto;
}

/* ---------- konfety ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden;}
.fx-p{position:absolute;top:-30px;animation-name:fxfall;animation-timing-function:linear;animation-fill-mode:forwards;}
@keyframes fxfall{to{transform:translateY(115vh) rotate(520deg);}}

/* ---------- vzhled: palety ---------- */
.bg-row{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin-bottom:4px;}
.bg-sw{
  aspect-ratio:1/1;width:100%;border-radius:50%;border:2px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;padding:0;
  transition:transform .1s,border-color .15s,box-shadow .15s;
}
.bg-sw:active{transform:scale(.88);}
.bg-sw.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring);}
.sw-check{font-size:15px;font-weight:800;color:#1c1c1e;line-height:1;}
.sw-check.lite{color:#f2f2f7;}
.theme-lbl{display:block;font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 2px 8px;}

/* ---------- trenérský check-in ---------- */
.ck-tools{display:flex;justify-content:flex-end;gap:8px;margin:0 0 6px;}
.ck-sec{display:flex;align-items:center;justify-content:space-between;}
.ck-lbl2{margin-left:8px;}
.ck-gap{margin-top:10px;}
.ck-sec .lnk{min-height:26px;min-width:30px;font-size:14px;}
.ck-card{padding:13px 14px;}
.ck-row-top{display:flex;align-items:center;gap:12px;}
.ck-row-top .ck-in{max-width:110px;}
.ck-lbl{font-size:14px;font-weight:700;flex:0 0 auto;}
.ck-in{
  min-height:40px;padding:7px 10px;font-size:16px;width:100%;min-width:0;
  background:var(--field-bg);border:1px solid var(--line);border-radius:10px;color:var(--text);
  font-variant-numeric:tabular-nums;
}
.ck-in.grow{flex:1;}
.ck-grid{display:grid;grid-template-columns:34px repeat(4,minmax(0,1fr));gap:6px;align-items:center;margin-bottom:6px;border-radius:10px;}
.ck-grid.ck-head{margin-bottom:4px;}
.ck-grid.ck-head span{font-size:11px;color:var(--muted);text-align:center;font-weight:700;}
.ck-grid .ck-in{text-align:center;padding:7px 4px;}
.ck-day{font-size:13px;font-weight:800;color:var(--muted);}
.ck-grid.ck-now{outline:2px solid var(--accent-ring);outline-offset:2px;}
.ck-grid.ck-now .ck-day{color:var(--accent);}
.ck-now .ck-in{border-color:var(--accent);}
.ck-hint{font-size:12px;color:var(--muted);margin:8px 2px 0;}
.ck-flex{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;}
.ck-mini{display:flex;flex-direction:column;gap:4px;flex:1;min-width:70px;}
.ck-mini span{font-size:12px;font-weight:700;color:var(--muted);}
.ck-mini.ck-now span{color:var(--accent);}
.ck-run{padding:10px 0;border-top:1px solid var(--line);border-radius:10px;}
.ck-run:first-child{border-top:0;padding-top:0;}
.ck-run.ck-now{padding-left:10px;padding-right:10px;margin:0 -10px;outline:2px solid var(--accent-ring);outline-offset:-1px;}
.ck-run-t{font-size:13px;font-weight:800;margin-bottom:7px;}
.ck-run.ck-now .ck-run-t{color:var(--accent);}
.ck-chips{display:inline-flex;gap:6px;flex:0 0 auto;}
.ck-chips .day-chip{flex:0 0 auto;min-width:56px;}
.ck-srow{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-top:1px solid var(--line);}
.ck-srow:first-child{border-top:0;padding-top:0;}
.ck-srow>span{font-size:12.5px;font-weight:700;color:var(--muted);}
.ck-srow.ck-now>span{color:var(--accent);}
.ck-srow.ck-now .ck-in{border-color:var(--accent);}
.ck-today{
  display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.02em;text-transform:none;
  background:var(--accent);color:var(--accent-text);border-radius:999px;padding:2px 8px;vertical-align:1px;
}

.ck-sgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,.8fr);gap:8px;}
.ck-strow{padding:9px 0;border-top:1px solid var(--line);}
.ck-strow:first-child{border-top:0;padding-top:0;}
.ck-strow:last-child{padding-bottom:0;}
.ck-mini.ck-solo{max-width:140px;}
.ck-shoulder{margin-top:22px;}
.ck-shoulder-body{padding:2px 14px 12px;}
.ck-shoulder-body .ck-srow:first-child{border-top:1px solid var(--line);padding-top:8px;}

/* ---------- nákup a plán jídel ---------- */
.shop-card{margin-top:18px;opacity:1;}
.shop-body{padding:2px 14px 14px;}
.shop-body .meal-f{margin-bottom:4px;}
.shop-lbl{margin-top:12px;}
.shop-list{list-style:none;margin:2px 0 4px;padding:0;}
.shop-it{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);min-height:46px;}
.shop-it:last-child{border-bottom:0;}
.shop-chk{
  width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;padding:0;transition:background .15s,border-color .15s;
}
.shop-it.done .shop-chk{background:var(--green);border-color:var(--green);}
.shop-it.done .shop-chk span::after{content:'✓';color:#fff;font-size:14px;font-weight:800;}
.shop-t{flex:1;min-width:0;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
.shop-it.done .shop-t{color:var(--muted);text-decoration:line-through;}
.shop-del{min-width:38px;min-height:38px;box-shadow:none;background:transparent;color:var(--muted);font-size:14px;}
.shop-empty{font-size:13.5px;margin:6px 0 8px;}
.shop-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 2px;list-style:none;}
.shop-it + .shop-h,.shop-h:not(:first-child){border-top:1px solid var(--line);margin-top:4px;padding-top:12px;}
.shop-ht{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.shop-h .shop-del{min-height:30px;min-width:30px;font-size:12px;opacity:.6;}
.shop-acts{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;}
.shop-add{display:flex;gap:8px;margin-top:8px;}
.shop-add .meal-f{flex:1;margin:0;}
.shop-add .btn{flex:0 0 auto;min-width:52px;font-size:19px;}

/* ---------- milníky ---------- */
.mile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
@media (min-width:600px){.mile-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
.mile{
  border:1.5px dashed var(--line);border-radius:12px;padding:10px 8px;text-align:center;
  display:flex;flex-direction:column;gap:2px;opacity:.5;min-width:0;
}
.mile.got{border-style:solid;border-color:var(--green);background:var(--green-soft);opacity:1;}
.mile-e{font-size:22px;line-height:1.2;}
.mile.got .mile-e{filter:none;}
.mile:not(.got) .mile-e{filter:grayscale(1);}
.mile-t{font-size:12.5px;font-weight:700;line-height:1.25;}
.mile-d{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.modal-actions .btn{flex:1;}
.modal-actions.col{flex-direction:column;}
.modal-actions.col .btn{width:100%;}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);
  background:#2c2c2e;color:#fff;font-size:14.5px;font-weight:600;
  padding:11px 20px;border-radius:22px;max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;z-index:200;
  box-shadow:0 6px 22px rgba(0,0,0,.28);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.err{background:var(--red);color:#fff;}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}

/* ================= design v2 ================= */
body{font-size:16px;letter-spacing:-.01em;}
.app-top{display:none;}
#app{padding-top:14px;}

/* velký titulek + modrý meta text vpravo */
.daynav{align-items:baseline;gap:8px;margin:2px 0 18px;}
.daynav-mid{order:1;flex:1;display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-width:0;text-align:left;}
.daynav .icon-btn{order:2;width:34px;height:34px;min-width:34px;min-height:34px;border-radius:50%;background:transparent;box-shadow:none;color:var(--muted);font-size:21px;}
.daynav .icon-btn:active{background:var(--btn-bg);}
.daynav-date{font-size:32px;font-weight:800;letter-spacing:-.035em;line-height:1.08;}
.daynav-sub{font-size:13.5px;font-weight:600;color:var(--accent);white-space:nowrap;}
.daynav-sub .linklike{color:var(--accent);font-weight:600;}

/* progres pod titulkem */
.progress-card{margin:-8px 0 18px;}
.progress-txt{display:flex;align-items:baseline;justify-content:space-between;font-size:14.5px;margin-bottom:9px;}
.progress-txt strong{font-weight:700;}
.progress-txt .muted{font-size:13.5px;}
.segbar{display:flex;gap:4px;}
.segbar span{flex:1;height:4px;border-radius:2px;background:var(--btn-bg);transition:background .2s;}
.segbar span.on{background:var(--accent);}
.pc-tools{margin-top:11px;display:flex;justify-content:flex-end;}

/* sekce s linkou */
.sec-title{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:24px 2px 10px;}
.sec-title::after{content:'';flex:1;height:1px;background:var(--line);}
.sec-title.ck-sec::after{display:none;}

/* karty */
.card{border-radius:18px;padding:15px 16px;box-shadow:none;background:var(--card);margin-bottom:12px;}

/* seznam návyků jako časová osa */
.habit-list{position:relative;padding-left:26px;gap:10px;}
.habit-list::before{content:'';position:absolute;left:6px;top:16px;bottom:16px;width:2px;background:var(--line);border-radius:1px;}
.habit-row{position:relative;border-radius:18px;padding:13px 14px;gap:12px;box-shadow:none;}
.habit-row::before{content:'';position:absolute;left:-25.5px;top:50%;transform:translateY(-50%);width:13px;height:13px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--line);}
.habit-row.done::before{background:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);}
.habit-row.done{background:transparent;}
.h-emoji{width:38px;height:38px;border-radius:12px;background:var(--field-bg);display:inline-flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto;}
.habit-row.done .h-emoji{background:transparent;}
.h-name{font-size:16px;font-weight:650;}
.h-meta{gap:8px;}
.h-goal{font-size:13px;color:var(--muted);}
.h-streak{background:transparent;padding:0;font-size:13px;font-weight:600;color:var(--muted);}
.h-streak.zero{opacity:.45;}
.checkbox{width:27px;height:27px;border-radius:50%;border:2px solid var(--line);}
.habit-row.done .checkbox{background:var(--accent);border-color:var(--accent);}
.mini-bar{height:3px;border-radius:2px;margin-top:7px;}

/* nástrojová řádka */
.toolbar{gap:8px;margin:2px 0 6px;}
.toolbar .btn.small{width:38px;height:38px;min-height:38px;border-radius:50%;background:var(--btn-bg);box-shadow:none;font-size:16px;padding:0;}

/* spodní lišta s linkovými ikonami */
.tabbar-inner{gap:0;}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:9px 0 5px;min-height:52px;color:var(--muted);transform:none;}
.tab-btn.on{color:var(--accent);}
.tab-ico{width:24px;height:24px;display:block;font-size:0;}
.tab-ico svg{width:24px;height:24px;display:block;}
.tab-lbl{font-size:10.5px;font-weight:600;letter-spacing:0;opacity:1;}
.tab-btn.on .tab-lbl{font-weight:700;}
.tab-day{display:none;}

/* pole a tlačítka */
.btn{border-radius:13px;box-shadow:none;font-weight:600;}
input,textarea,select,.meal-f,.ck-in{border-radius:13px;}

/* ---- hlavičky pohledů ---- */
.view-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:2px 2px 18px;}
.view-title{font-size:32px;font-weight:800;letter-spacing:-.035em;margin:0;line-height:1.08;}
.view-meta{font-size:13.5px;font-weight:600;color:var(--accent);white-space:nowrap;}

/* ---- statistické karty ---- */
.stat-cards{gap:11px;margin-bottom:16px;}
.stat{border-radius:18px;padding:17px 16px;box-shadow:none;background:var(--card);gap:2px;}
.stat-num{font-size:33px;font-weight:800;letter-spacing:-.03em;line-height:1.1;}
.stat-lbl{font-size:12.5px;color:var(--muted);line-height:1.3;}
.stat-cards .stat:nth-child(3){background:var(--accent);}
.stat-cards .stat:nth-child(3) .stat-num,.stat-cards .stat:nth-child(3) .stat-lbl{color:var(--accent-text);}
.stat-cards .stat:nth-child(3) .stat-lbl{opacity:.85;}

/* ---- tabulka návyků ---- */
.table-card{padding:6px 14px;}
.stat-table{font-size:14.5px;}
.stat-table th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 8px;border-bottom:1px solid var(--line);}
.stat-table td{padding:13px 8px;}
.tbl-emoji{width:26px;display:inline-block;}
.dimnum{color:var(--muted);}
.rate{display:inline-flex;align-items:center;gap:9px;justify-content:flex-end;}
.rate-bar{width:52px;height:4px;border-radius:2px;background:var(--btn-bg);overflow:hidden;flex:0 0 auto;}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}
function plural(n, one, few, many){
  n = Math.abs(n);
  if (n === 1) return one;
  if (n >= 2 && n <= 4) return few;
  return many;
}
function fmtNum(n){
  if (!isFinite(n)) return '0';
  const r = Math.round(n * 100) / 100;
  return String(r).replace('.', ',');
}
function parseNum(s){
  if (typeof s !== 'string') return NaN;
  s = s.trim().replace(',', '.');
  if (s === '') return NaN;
  return Number(s);
}
function today(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function addDays(d, n){
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
}
function dateKey(d){
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + day;
}
function parseKey(k){
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function sameDay(a, b){
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function startOfWeek(d){
  return addDays(d, -((d.getDay() + 6) % 7)); // pondělí
}
function firstOfMonth(d){
  return new Date(d.getFullYear(), d.getMonth(), 1);
}
function cap(s){
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}

const FMT_MONTH  = new Intl.DateTimeFormat('cs-CZ', { month:'long', year:'numeric' });
function fmtDateFull(d){
  const f = d.getFullYear() === today().getFullYear() ? FMT_FULL : FMT_FULL_Y;
  return cap(f.format(d));
}
function fmtWeekRange(mon){
  const sun = addDays(mon, 6);
  const dm = x => x.getDate() + '. ' + (x.getMonth() + 1) + '.';
  const yr = sun.getFullYear() !== today().getFullYear() ? ' ' + sun.getFullYear() : '';
  return dm(mon) + ' – ' + dm(sun) + yr;
}

/* ============ Validace a normalizace importu ============ */
function validateData(obj){
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return 'Soubor neobsahuje platný objekt dat.';
  if (!Array.isArray(obj.habits)) return 'Chybí seznam návyků („habits“).';
  const ids = new Set();
  for (let i = 0; i < obj.habits.length; i++){
    const h = obj.habits[i];
    if (!h || typeof h !== 'object') return 'Návyk č. ' + (i + 1) + ' není platný objekt.';
    if (typeof h.id !== 'string' && typeof h.id !== 'number') return 'Návyk č. ' + (i + 1) + ' nemá platné ID.';
    if (ids.has(String(h.id))) return 'Duplicitní ID návyku: ' + h.id;
    ids.add(String(h.id));
    if (typeof h.name !== 'string' || !h.name.trim()) return 'Návyk č. ' + (i + 1) + ' nemá název.';
    if (h.type !== 'check' && h.type !== 'number') return 'Návyk „' + h.name + '“ má neznámý typ (povoleno: check, number).';
    if (h.type === 'number' && (typeof h.goal !== 'number' || !isFinite(h.goal) || h.goal <= 0)) return 'Návyk „' + h.name + '“ nemá platný číselný cíl.';
    if (h.freq != null){
      const f = h.freq;
      if (typeof f !== 'object' || Array.isArray(f)) return 'Návyk „' + h.name + '“ má neplatnou frekvenci.';
      if (['daily', 'days', 'weekly', 'biweekly', 'monthly', 'every'].indexOf(f.type) === -1) return 'Návyk „' + h.name + '“ má neznámou frekvenci.';
      if (f.type === 'every' && !(Number.isInteger(f.days) && f.days >= 2 && f.days <= 365)) return 'Návyk „' + h.name + '“ má neplatný interval (2–365 dní).';
      if (f.type === 'every' && h.type === 'number') return 'Interval „za X dní" je jen pro ano/ne návyky („' + h.name + '“).';
      if (f.type === 'days' && (!Array.isArray(f.days) || !f.days.length || f.days.some(d => !Number.isInteger(d) || d < 0 || d > 6))) return 'Návyk „' + h.name + '“ má neplatné dny v týdnu.';
    }
    if (h.timerMin != null && !(Number.isInteger(h.timerMin) && h.timerMin >= 1 && h.timerMin <= 600)) return 'Návyk „' + h.name + '“ má neplatný časovač.';
    if (h.link != null && safeLink(h.link) === null) return 'Návyk „' + h.name + '“ má neplatný odkaz.';
    if (h.vacations != null){
      if (!Array.isArray(h.vacations)) return 'Návyk „' + h.name + '“ má neplatné prázdniny.';
      for (const v of h.vacations){
        if (!v || typeof v !== 'object' || !DATE_RE.test(String(v.from)) || !DATE_RE.test(String(v.to)) || String(v.from) > String(v.to)) return 'Návyk „' + h.name + '“ má neplatné rozmezí prázdnin.';
      }
    }
  }
  if (obj.meals != null){
    if (typeof obj.meals !== 'object' || Array.isArray(obj.meals)) return 'Jídelníček („meals“) má špatný formát.';
    for (const k of Object.keys(obj.meals)){
      if (!DATE_RE.test(k) || dateKey(parseKey(k)) !== k) return 'Neplatné datum v jídelníčku: ' + k;
      const v = obj.meals[k];
      if (typeof v === 'string') continue; // starší formát
      if (!v || typeof v !== 'object' || Array.isArray(v)) return 'Záznam jídelníčku pro ' + k + ' má špatný formát.';
      for (const f of ['b', 'l', 'd', 'note']){
        if (v[f] != null && typeof v[f] !== 'string') return 'Záznam jídelníčku pro ' + k + ' má neplatné pole.';
      }
      if (v.sn != null && (!Array.isArray(v.sn) || v.sn.some(x => typeof x !== 'string'))) return 'Svačiny pro ' + k + ' mají špatný formát.';
    }
  }
  if (obj.theme != null && (typeof obj.theme !== 'object' || Array.isArray(obj.theme))) return 'Vzhled („theme“) má špatný formát.';
  if (obj.notes != null){
    if (typeof obj.notes !== 'object' || Array.isArray(obj.notes)) return 'Poznámky („notes“) mají špatný formát.';
    for (const k of Object.keys(obj.notes)){
      if (!DATE_RE.test(k)) return 'Neplatné datum v poznámkách: ' + k;
      const day = obj.notes[k];
      if (!day || typeof day !== 'object' || Array.isArray(day)) return 'Poznámky pro ' + k + ' mají špatný formát.';
      for (const hid of Object.keys(day)){
        if (typeof day[hid] !== 'string') return 'Poznámka pro ' + k + ' není text.';
      }
    }
  }
  if (obj.milestones != null && (typeof obj.milestones !== 'object' || Array.isArray(obj.milestones))) return 'Milníky mají špatný formát.';
  if (obj.checkins != null && (typeof obj.checkins !== 'object' || Array.isArray(obj.checkins))) return 'Check-iny mají špatný formát.';
  if (obj.shopping != null){
    if (typeof obj.shopping !== 'object' || Array.isArray(obj.shopping)) return 'Nákupní seznam má špatný formát.';
    if (obj.shopping.items != null && !Array.isArray(obj.shopping.items)) return 'Položky nákupu mají špatný formát.';
  }
  if (obj.entries != null){
    if (typeof obj.entries !== 'object' || Array.isArray(obj.entries)) return 'Záznamy („entries“) mají špatný formát.';
    for (const k of Object.keys(obj.entries)){
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || dateKey(parseKey(k)) !== k) return 'Neplatné datum v záznamech: ' + k;
      const day = obj.entries[k];
      if (!day || typeof day !== 'object' || Array.isArray(day)) return 'Záznam pro ' + k + ' má špatný formát.';
      for (const hid of Object.keys(day)){
        const v = day[hid];
        if (v !== true && !(typeof v === 'number' && isFinite(v) && v >= 0)) return 'Neplatná hodnota v záznamu ' + k + '.';
      }
    }
  }
  if (obj.plan != null && typeof obj.plan !== 'string') return 'Plán („plan“) má špatný formát.';
  return null; // OK
}
function normalizeData(obj){
  const out = {
    version: 1,
    habits: [],
    entries: {},
    meals: {},
    notes: {},
    milestones: {},
    checkins: {},
    shopping: { note: '', items: [] },
    hideDone: !!obj.hideDone,
    theme: normTheme(obj.theme || (typeof obj.bg === 'string' && LEGACY_BG_IDS[obj.bg] ? { bg: LEGACY_BG_IDS[obj.bg] } : null)),
    plan: typeof obj.plan === 'string' ? obj.plan.slice(0, 50000) : DEFAULT_PLAN
  };
  const convertedWork = new Set();
  obj.habits.forEach((h, i) => {
    const nh = {
      id: String(h.id),
      name: String(h.name).trim().slice(0, 60),
      emoji: typeof h.emoji === 'string' ? h.emoji.slice(0, 8) : '',
      type: h.type,
      goal: h.type === 'number' ? Math.round(h.goal * 100) / 100 : null,
      unit: typeof h.unit === 'string' ? h.unit.trim().slice(0, 20) : '',
      archived: !!h.archived,
      order: typeof h.order === 'number' && isFinite(h.order) ? h.order : i,
      createdAt: typeof h.createdAt === 'number' ? h.createdAt : Date.now(),
      freq: normFreq(h.freq),
      vacations: normVacs(h.vacations),
      timerMin: (Number.isInteger(h.timerMin) && h.timerMin >= 1 && h.timerMin <= 600) ? h.timerMin : null,
      link: safeLink(h.link)
    };
    // jednorázová migrace: výchozí Práce (ano/ne denně) → 85 h měsíčně, součtově
    if (nh.name === 'Práce' && nh.type === 'check' && nh.freq.type === 'daily'){
      nh.type = 'number'; nh.goal = 85; nh.unit = 'h'; nh.freq = { type: 'monthly' };
      convertedWork.add(nh.id);
    }
    out.habits.push(nh);
  });
  if (out.plan === LEGACY_PLAN_1 || out.plan === LEGACY_PLAN_2) out.plan = DEFAULT_PLAN; // nezměněný výchozí plán → aktuální verze
  if (obj.meals){
    for (const k of Object.keys(obj.meals)){
      const m = normMeal(obj.meals[k]);
      if (m) out.meals[k] = m;
    }
  }
  if (obj.notes){
    for (const k of Object.keys(obj.notes)){
      if (!DATE_RE.test(k) || !obj.notes[k] || typeof obj.notes[k] !== 'object') continue;
      const day = {};
      for (const hid of Object.keys(obj.notes[k])){
        const t = obj.notes[k][hid];
        if (typeof t === 'string' && t.trim()) day[String(hid)] = t.slice(0, 500);
      }
      if (Object.keys(day).length) out.notes[k] = day;
    }
  }
  if (obj.shopping && typeof obj.shopping === 'object' && !Array.isArray(obj.shopping)){
    if (typeof obj.shopping.note === 'string') out.shopping.note = obj.shopping.note.slice(0, 2000);
    if (Array.isArray(obj.shopping.items)){
      out.shopping.items = obj.shopping.items
        .filter(it => it && typeof it.t === 'string' && it.t.trim())
        .slice(0, 200)
        .map(it => Object.assign({ t: it.t.trim().slice(0, 120), done: !!it.done }, it.h ? { h: true } : {}));
    }
  }
  if (obj.checkins && typeof obj.checkins === 'object' && !Array.isArray(obj.checkins)){
    for (const wk of Object.keys(obj.checkins)){
      if (!DATE_RE.test(wk)) continue;
      const src = obj.checkins[wk];
      if (!src || typeof src !== 'object') continue;
      const cw = {};
      for (const p of CK_PATHS){
        const v = ckRead(src, p);
        if (typeof v === 'string' && v.trim()) ckWrite(cw, p, v.slice(0, 500));
        else if (typeof v === 'number' && isFinite(v)) ckWrite(cw, p, String(v));
      }
      if (Object.keys(cw).length) out.checkins[wk] = cw;
    }
  }
  if (obj.milestones && typeof obj.milestones === 'object'){
    for (const id of Object.keys(obj.milestones)){
      const v = obj.milestones[id];
      if (typeof v === 'string' && DATE_RE.test(v)) out.milestones[String(id).slice(0, 40)] = v;
    }
  }
  if (obj.entries){
    for (const k of Object.keys(obj.entries)){
      const src = obj.entries[k], day = {};
      for (const hid of Object.keys(src)){
        const v = src[hid];
        if (v === true && convertedWork.has(String(hid))) continue; // fajfky staré Práce → v hodinách nemají smysl
        if (v === true) day[String(hid)] = true;
        else if (typeof v === 'number' && v > 0) day[String(hid)] = Math.round(v * 100) / 100;
      }
      if (Object.keys(day).length) out.entries[k] = day;
    }
  }
  return out;
}

/* ============ Synchronizace do GitHub repozitáře (větev data) ============ */
const SYNC_T = 'ht-sync-token';
const SYNC_R = 'ht-sync-repo'; // {owner, repo, branch, sha}
const SYNC_M = 'ht-sync-meta';
const SYNC_FILE = 'habit-tracker.json';
const SYNC_BRANCH = 'data';
let syncTimer = null;
let SYNC_DEBOUNCE = 40000; // po změně počká, ať se nenahrává každé ťuknutí
let syncBusy = false;
function ghRepoDefault(){
  let owner = '94zryjbn5k-png', repo = 'habit-tracker';
  try {
    if (location.hostname.endsWith('.github.io')) owner = location.hostname.split('.')[0];
    const seg = location.pathname.split('/').filter(Boolean)[0];
    if (seg) repo = seg;
  } catch (e) {}
  return { owner, repo };
}
function syncToken(){ try { return localStorage.getItem(SYNC_T) || ''; } catch (e) { return ''; } }
function syncRepo(){
  try { return JSON.parse(localStorage.getItem(SYNC_R)) || null; } catch (e) { return null; }
}
function setSyncRepo(patch){
  const r = Object.assign(syncRepo() || {}, patch);
  try { localStorage.setItem(SYNC_R, JSON.stringify(r)); } catch (e) {}
  return r;
}
function syncConfigured(){ return !!(syncToken() && syncRepo()); }
function syncMeta(){
  try { return JSON.parse(localStorage.getItem(SYNC_M)) || {}; } catch (e) { return {}; }
}
function setSyncMeta(patch){
  const m = Object.assign(syncMeta(), patch);
  try { localStorage.setItem(SYNC_M, JSON.stringify(m)); } catch (e) {}
  return m;
}
function syncRawUrl(){
  const r = syncRepo();
  return r ? 'https://raw.githubusercontent.com/' + r.owner + '/' + r.repo + '/' + SYNC_BRANCH + '/' + SYNC_FILE : '';
}
function ghHeaders(){
  return { 'Authorization': 'Bearer ' + syncToken(), 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
}
function ghApi(path){
  const r = syncRepo() || ghRepoDefault();
  return 'https://api.github.com/repos/' + r.owner + '/' + r.repo + path;
}
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(String(b64 || '').replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function scheduleSync(){
  setSyncMeta({ pending: true });
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncNow(); }, SYNC_DEBOUNCE);
}
function syncPut(retry){
  const body = {
    message: 'sync ' + dateKey(today()),
    content: b64encode(JSON.stringify(data, null, 1)),
    branch: SYNC_BRANCH
  };
  const sha = (syncRepo() || {}).sha;
  if (sha) body.sha = sha;
  return fetch(ghApi('/contents/' + SYNC_FILE), { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body) })
    .then(r => {
      if (r.ok) return r.json().then(j => {
        setSyncRepo({ sha: j.content && j.content.sha });
        setSyncMeta({ lastAt: Date.now(), err: null, pending: false });
      });
      if ((r.status === 409 || r.status === 422) && !retry){
        // sha zastaralá (zápis odjinud) — načíst novou a zkusit jednou znovu
        return fetch(ghApi('/contents/' + SYNC_FILE + '?ref=' + SYNC_BRANCH), { headers: ghHeaders() })
          .then(r2 => r2.ok ? r2.json() : null)
          .then(j => { if (j && j.sha) setSyncRepo({ sha: j.sha }); return syncPut(true); });
      }
      setSyncMeta({ err: r.status, pending: true });
    });
}
function syncNow(){
  if (!syncConfigured() || typeof fetch === 'undefined' || syncBusy) return Promise.resolve();
  if (syncTimer){ clearTimeout(syncTimer); syncTimer = null; }
  syncBusy = true;
  return syncPut(false)
    .catch(() => { setSyncMeta({ err: 'offline', pending: true }); })
    .then(() => { syncBusy = false; if (tab === 'stats') render(); });
}
function syncConnect(token){
  if (typeof fetch === 'undefined'){ toast('Prohlížeč nepodporuje synchronizaci', true); return; }
  try { localStorage.setItem(SYNC_T, token); } catch (e) {}
  const def = ghRepoDefault();
  setSyncRepo({ owner: def.owner, repo: def.repo, branch: SYNC_BRANCH, sha: null });
  toast('Ověřuji token…');
  fetch(ghApi('/contents/' + SYNC_FILE + '?ref=' + SYNC_BRANCH), { headers: ghHeaders() })
    .then(r => {
      if (r.status === 200) return r.json().then(j => {
        setSyncRepo({ sha: j.sha });
        openModal(
          '<div class="sheet-title">☁️ Nalezena existující záloha</div>'
          + '<p class="muted" style="margin:0 0 12px;font-size:14px">Ve větvi „data\u201c už záloha je. Co s ní?</p>'
          + '<div class="modal-actions" style="flex-direction:column;gap:8px">'
          + '<button class="btn primary" data-action="syncPull">⬇️ Stáhnout zálohu do appky</button>'
          + '<button class="btn" data-action="syncPushInit">⬆️ Přepsat ji daty z tohoto zařízení</button>'
          + '</div>'
        );
        return null;
      });
      if (r.status === 404) return ensureDataBranch().then(() => syncNow()).then(() => {
        const ok = !syncMeta().err;
        if (ok){ render(); toast('Záloha vytvořena — od teď se synchronizuje sama'); }
        else throw new Error('put');
      });
      throw new Error('token');
    })
    .catch(() => {
      try { localStorage.removeItem(SYNC_T); localStorage.removeItem(SYNC_R); } catch (e) {}
      toast('Token nefunguje — potřebuje právo Contents (čtení a zápis) k repozitáři', true);
    });
}
function ensureDataBranch(){
  return fetch(ghApi('/branches/' + SYNC_BRANCH), { headers: ghHeaders() })
    .then(r => {
      if (r.ok) return null;
      return fetch(ghApi(''), { headers: ghHeaders() })
        .then(r2 => r2.json())
        .then(info => fetch(ghApi('/git/ref/heads/' + (info.default_branch || 'main')), { headers: ghHeaders() }))
        .then(r3 => r3.json())
        .then(ref => fetch(ghApi('/git/refs'), {
          method: 'POST', headers: ghHeaders(),
          body: JSON.stringify({ ref: 'refs/heads/' + SYNC_BRANCH, sha: ref.object.sha })
        }));
    });
}
function syncPull(){
  fetch(ghApi('/contents/' + SYNC_FILE + '?ref=' + SYNC_BRANCH), { headers: ghHeaders() })
    .then(r => r.json())
    .then(j => {
      const obj = JSON.parse(b64decode(j.content));
      const err = validateData(obj);
      if (err) throw new Error(err);
      setSyncRepo({ sha: j.sha });
      data = normalizeData(obj);
      save();
      closeModal();
      render();
      toast('Záloha načtena do appky');
      setSyncMeta({ lastAt: Date.now(), err: null, pending: false });
    })
    .catch(() => toast('Zálohu se nepodařilo načíst', true));
}
function syncDisconnect(){
  try { localStorage.removeItem(SYNC_T); localStorage.removeItem(SYNC_R); localStorage.removeItem(SYNC_M); } catch (e) {}
  if (syncTimer){ clearTimeout(syncTimer); syncTimer = null; }
  render();
  toast('Synchronizace odpojena (záloha na GitHubu zůstává)');
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && syncConfigured() && syncMeta().pending) syncNow();
});
window.addEventListener('online', () => {
  if (syncConfigured() && syncMeta().pending) syncNow();
});
function load(){
  if (storageOk){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw){
        const obj = JSON.parse(raw);
        if (!validateData(obj)) return normalizeData(obj);
      }
    } catch (e) {}
  }
  return defaultData();
}

/* ============ Záznamy ============ */
function getVal(key, habitId){
  const day = data.entries[key];
  return day ? day[habitId] : undefined;
}
function setVal(key, habitId, value){
  const isTodayKey = key === dateKey(today());
  const before = isTodayKey ? dayStats(key).pct : -1;
  let day = data.entries[key];
  if (value === undefined || value === false || value === 0 || value === null){
    if (day){
      delete day[habitId];
      if (!Object.keys(day).length) delete data.entries[key];
    }
  } else {
    if (!day) day = data.entries[key] = {};
    day[habitId] = value;
  }
  save();
  if (isTodayKey && before > -1 && before < 100){
    const after = dayStats(key);
    if (after.total && after.pct === 100) celebrate('🎉 Perfektní den — vše splněno!');
  }
}
function isDone(habit, key){
  const v = getVal(key, habit.id);
  if (v === undefined) return false;
  if (habit.type === 'check') return v === true || (typeof v === 'number' && v > 0);
  const n = v === true ? (habit.goal || 1) : v;
  return typeof n === 'number' && n >= (habit.goal || 1);
}
function numVal(habit, key){
  const v = getVal(key, habit.id);
  if (typeof v === 'number') return v;
  if (v === true) return habit.goal || 1;
  return 0;
}
function activeHabits(){
  return data.habits.filter(h => !h.archived).sort((a, b) => a.order - b.order);
}
function archivedHabits(){
  return data.habits.filter(h => h.archived).sort((a, b) => a.order - b.order);
}
function habitById(id){
  return data.habits.find(h => h.id === id);
}

/* ============ Frekvence návyků ============ */
function weekdayIdx(d){
  return (d.getDay() + 6) % 7; // Po=0 … Ne=6
}
function habitFreq(h){
  return h && h.freq && h.freq.type ? h.freq : { type: 'daily' };
}
function normFreq(f){
  if (!f || typeof f !== 'object' || Array.isArray(f)) return { type: 'daily' };
  if (f.type === 'days'){
    const days = Array.isArray(f.days)
      ? [...new Set(f.days.filter(d => Number.isInteger(d) && d >= 0 && d <= 6))].sort((a, b) => a - b)
      : [];
    return days.length ? { type: 'days', days } : { type: 'daily' };
  }
  if (f.type === 'every'){
    const n = Number.isInteger(f.days) ? f.days : parseInt(f.days, 10);
    return { type: 'every', days: (isFinite(n) && n >= 2 && n <= 365) ? n : 14 };
  }
  if (f.type === 'weekly' || f.type === 'biweekly' || f.type === 'monthly') return { type: f.type };
  return { type: 'daily' };
}
function isPeriodic(h){
  const t = habitFreq(h).type;
  return t === 'weekly' || t === 'biweekly' || t === 'monthly' || t === 'every';
}
function isScheduled(h, d){
  if (onVacation(h, d)) return false; // prázdniny = nenaplánováno
  const f = habitFreq(h);
  if (f.type === 'daily') return true;
  if (f.type === 'days') return f.days.indexOf(weekdayIdx(d)) !== -1;
  return false; // týdenní/měsíční nemají pevné dny
}

/* ============ Prázdniny ============ */
function vacList(h){
  return Array.isArray(h.vacations) ? h.vacations : [];
}
function normVacs(v){
  if (!Array.isArray(v)) return [];
  const out = [];
  for (const r of v){
    if (!r || typeof r !== 'object') continue;
    const from = String(r.from || ''), to = String(r.to || '');
    if (!DATE_RE.test(from) || !DATE_RE.test(to)) continue;
    if (dateKey(parseKey(from)) !== from || dateKey(parseKey(to)) !== to) continue;
    if (from > to) continue;
    out.push({ from, to });
    if (out.length >= 100) break;
  }
  out.sort((a, b) => (a.from < b.from ? -1 : a.from > b.from ? 1 : 0));
  return out;
}
function onVacation(h, d){
  const k = dateKey(d);
  return vacList(h).some(v => v.from <= k && k <= v.to);
}
function vacUntil(h, d){
  const k = dateKey(d);
  const r = vacList(h).find(v => v.from <= k && k <= v.to);
  return r ? r.to : null;
}
function weekAllVacation(h, mon){
  for (let i = 0; i < 7; i++){
    if (!onVacation(h, addDays(mon, i))) return false;
  }
  return true;
}
const FORTNIGHT_EPOCH = startOfWeek(new Date(2024, 0, 1)); // pevná kotva čtrnáctidenních oken (Po 1. 1. 2024)
function fortnightStart(d){
  const mon = startOfWeek(d);
  const weeks = Math.round((mon - FORTNIGHT_EPOCH) / 604800000);
  return (((weeks % 2) + 2) % 2) === 0 ? mon : addDays(mon, -7);
}
function fortnightSum(h, fs){
  let s = 0;
  for (let i = 0; i < 14; i++){
    const v = getVal(dateKey(addDays(fs, i)), h.id);
    if (typeof v === 'number') s += v;
  }
  return Math.round(s * 100) / 100;
}
function fortnightAllVacation(h, fs){
  for (let i = 0; i < 14; i++){
    if (!onVacation(h, addDays(fs, i))) return false;
  }
  return true;
}
function diffD(a, b){
  return Math.round((b - a) / 86400000);
}
function lastDoneKey(h, refKey){
  let best = null;
  for (const k of Object.keys(data.entries)){
    if (k <= refKey && isDone(h, k) && (!best || k > best)) best = k;
  }
  return best;
}
function everyDue(h, d){
  const key = dateKey(d);
  if (isDone(h, key)) return false; // dnes už splněno
  const last = lastDoneKey(h, key);
  if (!last) return true;
  return diffD(parseKey(last), d) >= habitFreq(h).days;
}
function doneInFortnight(h, fs){
  if (h.type === 'number'){ // číselný cíl se sčítá přes celých 14 dní
    return fortnightSum(h, fs) >= (h.goal || 1) ? dateKey(fs) : null;
  }
  for (let i = 0; i < 14; i++){
    const k = dateKey(addDays(fs, i));
    if (isDone(h, k)) return k;
  }
  return null;
}
function monthAllVacation(h, first){
  const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  for (let i = 1; i <= days; i++){
    if (!onVacation(h, new Date(first.getFullYear(), first.getMonth(), i))) return false;
  }
  return true;
}
function periodicPaused(h, refDate){
  const f = habitFreq(h);
  if (f.type === 'weekly') return weekAllVacation(h, startOfWeek(refDate));
  if (f.type === 'biweekly') return fortnightAllVacation(h, fortnightStart(refDate));
  if (f.type === 'monthly') return monthAllVacation(h, firstOfMonth(refDate));
  if (f.type === 'every') return onVacation(h, refDate);
  return false;
}

function normMeal(v){

  if (!v || typeof v !== 'object' || Array.isArray(v)) return null;

  if (!m.b.trim() && !m.l.trim() && !m.d.trim() && !m.note.trim() && !m.sn.length) return null;

}

/* ============ Zmrazení streaku (1× týdně) ============ */
function weekMissDone(h, mon){
  const t = today();
  let miss = 0, done = 0;
  for (let i = 0; i < 7; i++){
    const d = addDays(mon, i);
    if (!isScheduled(h, d)) continue;
    if (isDone(h, dateKey(d))) done++;
    else if (d < t) miss++;
  }
  return { miss, done };
}
function prevScheduledDone(h, d){
  let p = addDays(d, -1), guard = 0;
  while (guard++ < 400){
    if (isScheduled(h, p)) return isDone(h, dateKey(p));
    p = addDays(p, -1);
  }
  return false;
}
function frozenDay(h, d){
  if (isPeriodic(h)) return false;
  if (d >= today()) return false;
  if (!isScheduled(h, d) || isDone(h, dateKey(d))) return false;
  if (!prevScheduledDone(h, d)) return false; // mrazí se jen rozjetá série
  return weekMissDone(h, startOfWeek(d)).miss === 1; // a max 1 prošvih v témže týdnu
}

let timerState = null;
let timerInt = null;
function timerPill(){
  let p = document.getElementById('timerpill');
  if (!p){
    p = document.createElement('div');
    p.id = 'timerpill';
    p.innerHTML = '<span id="tp-txt"></span><button data-action="cancelTimer" aria-label="Zrušit časovač">✕</button>';
    document.body.appendChild(p);
  }
  return p;
}
function startTimer(h, key){
  timerState = { id: h.id, key, name: h.name, endsAt: Date.now() + h.timerMin * 60000 };
  timerPill().hidden = false;
  if (!timerInt) timerInt = setInterval(timerTick, 500);
  timerTick();
}
function stopTimer(){
  timerState = null;
  if (timerInt){ clearInterval(timerInt); timerInt = null; }
  const p = document.getElementById('timerpill');
  if (p) p.hidden = true;
}
function timerTick(){
  if (!timerState) return;
  const rem = timerState.endsAt - Date.now();
  if (rem <= 0){
    const { id, key, name } = timerState;
    stopTimer();
    const h = habitById(id);
    if (h && h.type === 'check' && !isDone(h, key)){
      popRef = { id, key };
      setVal(key, id, true);
      toast('⏱️ ' + name + ' — hotovo, odškrtnuto ✓');
    } else {
      toast('⏱️ ' + name + ' — čas doběhl');
    }
    render();
    return;
  }
  const sec = Math.ceil(rem / 1000);
  const mm = Math.floor(sec / 60), ss = sec % 60;
  const el = document.getElementById('tp-txt');
  if (el) el.textContent = '⏱️ ' + timerState.name + ' · ' + mm + ':' + String(ss).padStart(2, '0');
}
function freqLabel(h){

  if (f.type === 'every') return '1× za ' + f.days + ' ' + plural(f.days, 'den', 'dny', 'dní');
  return FREQ_NAMES[f.type];
}
function weekSum(h, mon){
  let s = 0;
  for (let i = 0; i < 7; i++){
    const v = getVal(dateKey(addDays(mon, i)), h.id);
    if (typeof v === 'number') s += v;
  }
  return Math.round(s * 100) / 100;
}
function monthSum(h, first){
  const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  let s = 0;
  for (let i = 1; i <= days; i++){
    const v = getVal(dateKey(new Date(first.getFullYear(), first.getMonth(), i)), h.id);
    if (typeof v === 'number') s += v;
  }
  return Math.round(s * 100) / 100;
}
function doneInWeek(h, mon){
  if (h.type === 'number'){ // číselný týdenní cíl se sčítá přes celý týden
    return weekSum(h, mon) >= (h.goal || 1) ? dateKey(mon) : null;
  }
  for (let i = 0; i < 7; i++){
    const k = dateKey(addDays(mon, i));
    if (isDone(h, k)) return k;
  }
  return null;
}
function doneInMonth(h, first){
  if (h.type === 'number'){ // číselný měsíční cíl se sčítá přes celý měsíc
    return monthSum(h, first) >= (h.goal || 1) ? dateKey(first) : null;
  }
  const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  for (let i = 1; i <= days; i++){
    const k = dateKey(new Date(first.getFullYear(), first.getMonth(), i));
    if (isDone(h, k)) return k;
  }
  return null;
}
function fmtKeyShort(k){

  return WD[weekdayIdx(d)] + ' ' + d.getDate() + '. ' + (d.getMonth() + 1) + '.';
}

/* ============ Streaky a statistiky ============ */
function currentStreak(habit){
  const f = habitFreq(habit);
  if (f.type === 'weekly'){
    let mon = startOfWeek(today());
    let n = 0, guard = 0, current = true;
    while (guard++ < 3000){
      if (doneInWeek(habit, mon)){ n++; mon = addDays(mon, -7); current = false; continue; }
      if (weekAllVacation(habit, mon)){ mon = addDays(mon, -7); current = false; continue; } // prázdniny nepřerušují
      if (current){ current = false; mon = addDays(mon, -7); continue; } // běžící týden streak nepřerušuje
      break;
    }
    return n;
  }
  if (f.type === 'every'){
    const dones = Object.keys(data.entries).filter(k => isDone(habit, k)).sort();
    if (!dones.length) return 0;
    if (diffD(parseKey(dones[dones.length - 1]), today()) > f.days) return 0; // interval prošvihnut
    let n = 1;
    for (let i = dones.length - 1; i > 0; i--){
      if (diffD(parseKey(dones[i - 1]), parseKey(dones[i])) <= f.days) n++;
      else break;
    }
    return n;
  }
  if (f.type === 'biweekly'){
    let fs = fortnightStart(today());
    let n = 0, guard = 0, current = true;
    while (guard++ < 3000){
      if (doneInFortnight(habit, fs)){ n++; fs = addDays(fs, -14); current = false; continue; }
      if (fortnightAllVacation(habit, fs)){ fs = addDays(fs, -14); current = false; continue; } // prázdniny nepřerušují
      if (current){ current = false; fs = addDays(fs, -14); continue; } // běžící okno streak nepřerušuje
      break;
    }
    return n;
  }
  if (f.type === 'monthly'){
    let first = firstOfMonth(today());
    let n = 0, guard = 0, current = true;
    while (guard++ < 1200){
      if (doneInMonth(habit, first)){ n++; first = new Date(first.getFullYear(), first.getMonth() - 1, 1); current = false; continue; }
      if (monthAllVacation(habit, first)){ first = new Date(first.getFullYear(), first.getMonth() - 1, 1); current = false; continue; }
      if (current){ current = false; first = new Date(first.getFullYear(), first.getMonth() - 1, 1); continue; }
      break;
    }
    return n;
  }
  let d = today();
  if (isScheduled(habit, d) && !isDone(habit, dateKey(d))) d = addDays(d, -1); // dnešek zatím nesplněný streak nepřerušuje
  let n = 0, guard = 0;
  while (guard++ < 20000){
    if (!isScheduled(habit, d)){ d = addDays(d, -1); continue; } // nenaplánované a prázdninové dny se přeskakují
    if (!isDone(habit, dateKey(d))){
      if (frozenDay(habit, d)){ d = addDays(d, -1); continue; } // 🧊 zmrazení — max 1 prošvih týdně
      break;
    }
    n++;
    d = addDays(d, -1);
  }
  return n;
}
function longestStreak(habit){
  const f = habitFreq(habit);
  const doneDays = Object.keys(data.entries)
    .filter(k => isDone(habit, k))
    .map(parseKey)
    .sort((a, b) => a - b);
  if (!doneDays.length) return 0;
  if (f.type === 'weekly'){
    let mon = startOfWeek(doneDays[0]);
    const end = startOfWeek(today());
    let best = 0, run = 0, guard = 0;
    while (mon <= end && guard++ < 3000){
      if (doneInWeek(habit, mon)){ run++; if (run > best) best = run; }
      else if (!weekAllVacation(habit, mon)) run = 0; // prázdninový týden nepřerušuje
      mon = addDays(mon, 7);
    }
    return best;
  }
  if (f.type === 'every'){
    const dones = Object.keys(data.entries).filter(k => isDone(habit, k)).sort();
    let best = dones.length ? 1 : 0, run = 1;
    for (let i = 1; i < dones.length; i++){
      if (diffD(parseKey(dones[i - 1]), parseKey(dones[i])) <= f.days) run++;
      else run = 1;
      if (run > best) best = run;
    }
    return best;
  }
  if (f.type === 'biweekly'){
    let fs = fortnightStart(doneDays[0]);
    const end = fortnightStart(today());
    let best = 0, run = 0, guard = 0;
    while (fs <= end && guard++ < 3000){
      if (doneInFortnight(habit, fs)){ run++; if (run > best) best = run; }
      else if (!fortnightAllVacation(habit, fs)) run = 0;
      fs = addDays(fs, 14);
    }
    return best;
  }
  if (f.type === 'monthly'){
    let first = firstOfMonth(doneDays[0]);
    const end = firstOfMonth(today());
    let best = 0, run = 0, guard = 0;
    while (first <= end && guard++ < 1200){
      if (doneInMonth(habit, first)){ run++; if (run > best) best = run; }
      else if (!monthAllVacation(habit, first)) run = 0;
      first = new Date(first.getFullYear(), first.getMonth() + 1, 1);
    }
    return best;
  }
  let best = 0, run = 0, guard = 0;
  const end = today();
  for (let d = doneDays[0]; d <= end && guard++ < 20000; d = addDays(d, 1)){
    if (!isScheduled(habit, d)) continue; // nenaplánované a prázdninové dny se přeskakují
    if (isDone(habit, dateKey(d))){ run++; if (run > best) best = run; }
    else if (!frozenDay(habit, d)) run = 0; // 🧊 zmrazený den sérii nepřeruší
  }
  return best;
}
function scheduledFor(d){
  return activeHabits().filter(h => isScheduled(h, d));
}
function dayStats(key){
  const hs = scheduledFor(parseKey(key));
  if (!hs.length) return { done: 0, total: 0, pct: 0 };
  const done = hs.filter(h => isDone(h, key)).length;
  return { done, total: hs.length, pct: Math.round(done / hs.length * 100) };
}
function rateOverDays(n){
  let done = 0, total = 0;
  for (let i = 0; i < n; i++){
    const s = dayStats(dateKey(addDays(today(), -i)));
    done += s.done;
    total += s.total;
  }
  return total ? Math.round(done / total * 100) : 0;
}
function habitRate(habit){
  const f = habitFreq(habit);
  if (f.type === 'weekly'){
    let done = 0, total = 0;
    for (let i = 1; i <= 12 && total < 4; i++){ // poslední 4 hodnotitelné uzavřené týdny
      const mon = addDays(startOfWeek(today()), -7 * i);
      if (weekAllVacation(habit, mon)) continue;
      total++;
      if (doneInWeek(habit, mon)) done++;
    }
    return total ? Math.round(done / total * 100) : 0;
  }
  if (f.type === 'every'){
    const dones = Object.keys(data.entries).filter(k => isDone(habit, k)).sort();
    if (!dones.length) return 0;
    const gaps = [];
    for (let i = Math.max(1, dones.length - 6); i < dones.length; i++){
      gaps.push(diffD(parseKey(dones[i - 1]), parseKey(dones[i])));
    }
    const overdue = diffD(parseKey(dones[dones.length - 1]), today()) > f.days;
    if (!gaps.length) return overdue ? 0 : 100;
    const ok = gaps.filter(g => g <= f.days).length + (overdue ? 0 : 1);
    return Math.round(ok / (gaps.length + 1) * 100);
  }
  if (f.type === 'biweekly'){
    let done = 0, total = 0;
    for (let i = 1; i <= 9 && total < 3; i++){ // poslední 3 hodnotitelná uzavřená okna
      const fs = addDays(fortnightStart(today()), -14 * i);
      if (fortnightAllVacation(habit, fs)) continue;
      total++;
      if (doneInFortnight(habit, fs)) done++;
    }
    return total ? Math.round(done / total * 100) : 0;
  }
  if (f.type === 'monthly'){
    let done = 0, total = 0;
    const t = today();
    for (let i = 1; i <= 9 && total < 3; i++){ // poslední 3 hodnotitelné uzavřené měsíce
      const first = new Date(t.getFullYear(), t.getMonth() - i, 1);
      if (monthAllVacation(habit, first)) continue;
      total++;
      if (doneInMonth(habit, first)) done++;
    }
    return total ? Math.round(done / total * 100) : 0;
  }
  let done = 0, total = 0;
  for (let i = 0; i < 30; i++){
    const d = addDays(today(), -i);
    if (!isScheduled(habit, d)) continue;
    total++;
    if (isDone(habit, dateKey(d))) done++;
  }
  return total ? Math.round(done / total * 100) : 0;
}
