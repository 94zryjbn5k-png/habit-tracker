    + streakBadge(h)
    + '<span class="stepper">'
    +   '<button class="step-btn" data-action="dec" data-id="' + esc(h.id) + '" aria-label="Ubrat">−</button>'
    +   '<input class="num-input" inputmode="decimal" data-id="' + esc(h.id) + '" value="' + fmtNum(val) + '" aria-label="Hodnota – ' + esc(h.name) + '">'
    +   '<button class="step-btn" data-action="inc" data-id="' + esc(h.id) + '" aria-label="Přidat">＋</button>'
    + '</span>'
    + '</div>';
}
function periodicRow(h, key){
  const f = habitFreq(h);
  if (f.type === 'every'){
    const d = parseKey(key);
    const doneToday = isDone(h, key);
    const last = lastDoneKey(h, key);
    const due = everyDue(h, d);
    const done = !due;
    const pop = popRef && popRef.id === h.id && popRef.key === key;
    const nextFrom = doneToday ? d : (last ? parseKey(last) : null);
    const status = doneToday
      ? '✓ splněno — dnes · znovu ' + fmtKeyShort(dateKey(addDays(d, f.days)))
      : (!due && last)
      ? '✓ splněno — ' + fmtKeyShort(last) + ' · znovu ' + fmtKeyShort(dateKey(addDays(parseKey(last), f.days)))
      : last
      ? 'na řadě — naposledy ' + fmtKeyShort(last)
      : 'na řadě — zatím poprvé';
    const noteDot = getNote(key, h.id) ? ' <span class="note-dot" aria-label="Má poznámku">📝</span>' : '';
    const lnk = h.link ? '<a class="icon-btn lnk" href="' + esc(h.link) + '" data-action="openLink" rel="noopener" aria-label="Otevřít aplikaci">↗</a>' : '';
    const tmr = (h.timerMin && !doneToday) ? '<button class="icon-btn tmr" data-action="startTimer" data-id="' + esc(h.id) + '" data-key="' + key + '" aria-label="Spustit časovač ' + h.timerMin + ' min">⏱️</button>' : '';
    return '<div class="habit-row check' + (done ? ' done' : '') + '" role="checkbox" aria-checked="' + doneToday + '" tabindex="0" data-action="rowToggle" data-id="' + esc(h.id) + '" aria-label="' + esc(h.name) + '">'
      + '<span class="pop-wrap' + (pop ? ' pop' : '') + '">' + habitBadge(h) + '</span>'
      + '<span class="h-main"><span class="h-name">' + esc(h.name) + noteDot + '</span>'
      +   '<span class="h-meta"><span class="h-goal">' + status + '</span></span></span>'
      + lnk
      + tmr
      + streakBadge(h)
      + '<span class="checkbox" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path class="' + (pop ? 'draw' : '') + '" d="M5 13l4 4L19 7"/></svg></span>'
      + '</div>';
  }
  const scopeDone = f.type === 'weekly'
    ? doneInWeek(h, startOfWeek(parseKey(key)))
    : f.type === 'biweekly'
    ? doneInFortnight(h, fortnightStart(parseKey(key)))
    : doneInMonth(h, firstOfMonth(parseKey(key)));
  const done = !!scopeDone;
  const pop = popRef && popRef.id === h.id && popRef.key === key;
  const status = done
    ? '✓ splněno' + (scopeDone === key ? '' : ' — ' + fmtKeyShort(scopeDone))
    : (f.type === 'weekly' ? 'tento týden zatím ne' : f.type === 'biweekly' ? 'tyto 2 týdny zatím ne' : 'tento měsíc zatím ne');
  const noteDot = getNote(key, h.id) ? ' <span class="note-dot" aria-label="Má poznámku">📝</span>' : '';
  const lnk = h.link ? '<a class="icon-btn lnk" href="' + esc(h.link) + '" data-action="openLink" rel="noopener" aria-label="Otevřít aplikaci">↗</a>' : '';
  if (h.type === 'check'){
    const tmr = (h.timerMin && !done) ? '<button class="icon-btn tmr" data-action="startTimer" data-id="' + esc(h.id) + '" data-key="' + key + '" aria-label="Spustit časovač ' + h.timerMin + ' min">⏱️</button>' : '';
    return '<div class="habit-row check' + (done ? ' done' : '') + '" role="checkbox" aria-checked="' + done + '" tabindex="0" data-action="rowToggle" data-id="' + esc(h.id) + '" aria-label="' + esc(h.name) + '">'
      + '<span class="pop-wrap' + (pop ? ' pop' : '') + '">' + habitBadge(h) + '</span>'
      + '<span class="h-main"><span class="h-name">' + esc(h.name) + noteDot + '</span>'
      +   '<span class="h-meta"><span class="h-goal">' + status + '</span></span></span>'
      + lnk
      + tmr
      + streakBadge(h)
      + '<span class="checkbox" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path class="' + (pop ? 'draw' : '') + '" d="M5 13l4 4L19 7"/></svg></span>'
      + '</div>';
  }
  const val = numVal(h, key);
  const goal = h.goal || 1;
  const scopeSum = f.type === 'weekly' ? weekSum(h, startOfWeek(parseKey(key)))
    : f.type === 'biweekly' ? fortnightSum(h, fortnightStart(parseKey(key)))
    : monthSum(h, firstOfMonth(parseKey(key)));
  const scopeName = f.type === 'weekly' ? 'tento týden' : f.type === 'biweekly' ? 'tyto 2 týdny' : 'tento měsíc';
  const pct = Math.max(0, Math.min(100, Math.round(scopeSum / goal * 100)));
  const numStatus = fmtNum(scopeSum) + ' / ' + fmtNum(goal) + (h.unit ? ' ' + esc(h.unit) : '') + ' ' + scopeName
    + (val > 0 ? ' · dnes ' + fmtNum(val) : '')
    + (scopeSum >= goal ? ' ✓' : '');
  return '<div class="habit-row num' + (scopeSum >= goal ? ' done' : '') + '" data-id="' + esc(h.id) + '">'
    + '<span class="pop-wrap' + (pop ? ' pop' : '') + '">' + habitBadge(h) + '</span>'
    + '<span class="h-main">'
    +   '<span class="h-name">' + esc(h.name) + noteDot + '</span>'
    +   '<span class="h-meta"><span class="h-goal">' + numStatus + '</span></span>'
    +   '<span class="mini-bar"><span style="width:' + pct + '%"></span></span>'
    + '</span>'
    + lnk
    + streakBadge(h)
    + '<span class="stepper">'
    +   '<button class="step-btn" data-action="dec" data-id="' + esc(h.id) + '" aria-label="Ubrat">−</button>'
    +   '<input class="num-input" inputmode="decimal" data-id="' + esc(h.id) + '" value="' + fmtNum(val) + '" aria-label="Hodnota – ' + esc(h.name) + '">'
    +   '<button class="step-btn" data-action="inc" data-id="' + esc(h.id) + '" aria-label="Přidat">＋</button>'
    + '</span>'
    + '</div>';
}
function editRow(h, idx, count){
  const goalTxt = h.type === 'number' ? 'cíl ' + fmtNum(h.goal) + (h.unit ? ' ' + esc(h.unit) : '') : 'ano / ne';
  const vacNow = vacUntil(h, today());
  const meta = goalTxt + ' · ' + esc(freqLabel(h)) + (vacNow ? ' · 🏖️ do ' + fmtKeyShort(vacNow) : '');

    + '<span class="edit-controls">'

    +   '<button class="icon-btn" data-action="moveDown" data-id="' + esc(h.id) + '" aria-label="Posunout dolů"' + (idx === count - 1 ? ' disabled' : '') + '>↓</button>'
    +   '<button class="icon-btn" data-action="vacHabit" data-id="' + esc(h.id) + '" aria-label="Prázdniny">🏖️</button>'

    + '</div>';
}
function renderDay(){
  const key = dateKey(selectedDate);
  const isToday = sameDay(selectedDate, today());
  const hs = activeHabits();
  const dayHs = hs.filter(h => !isPeriodic(h) && isScheduled(h, selectedDate));
  const offCnt = hs.filter(h => !isPeriodic(h) && !isScheduled(h, selectedDate) && !onVacation(h, selectedDate)).length;
  const weekHs = hs.filter(h => habitFreq(h).type === 'weekly' && !periodicPaused(h, selectedDate));
  const biweekHs = hs.filter(h => habitFreq(h).type === 'biweekly' && !periodicPaused(h, selectedDate));
  const everyHs = hs.filter(h => habitFreq(h).type === 'every' && !periodicPaused(h, selectedDate));
  const monthHs = hs.filter(h => habitFreq(h).type === 'monthly' && !periodicPaused(h, selectedDate));
  const vacHs = hs.filter(h => isPeriodic(h) ? periodicPaused(h, selectedDate) : onVacation(h, selectedDate));
  const st = dayStats(key);
  let html = '<div class="daynav">'
    + '<button class="icon-btn" data-action="prevDay" aria-label="Předchozí den">‹</button>'
    + '<div class="daynav-mid"><div class="daynav-date">' + (isToday ? 'Dnes' : fmtDateFull(selectedDate)) + '</div>'
    + (isToday ? '<div class="daynav-sub">' + fmtDateFull(selectedDate) + '</div>'
               : '<div class="daynav-sub"><button class="linklike" data-action="goToday">Zpět na dnešek</button></div>')
    + '</div>'
    + '<button class="icon-btn" data-action="nextDay" aria-label="Další den"' + (isToday ? ' disabled' : '') + '>›</button>'
    + '</div>';

  const hide = !!data.hideDone && !editMode;
  const shownDay = hide ? dayHs.filter(h => !isDone(h, key)) : dayHs;
  const shownWeek = hide ? weekHs.filter(h => !doneInWeek(h, startOfWeek(selectedDate))) : weekHs;
  const shownBiweek = hide ? biweekHs.filter(h => !doneInFortnight(h, fortnightStart(selectedDate))) : biweekHs;
  const shownEvery = hide ? everyHs.filter(h => everyDue(h, selectedDate)) : everyHs;
  const shownMonth = hide ? monthHs.filter(h => !doneInMonth(h, firstOfMonth(selectedDate))) : monthHs;
  const hiddenCnt = (dayHs.length - shownDay.length) + (weekHs.length - shownWeek.length) + (biweekHs.length - shownBiweek.length) + (everyHs.length - shownEvery.length) + (monthHs.length - shownMonth.length);

  if (dayHs.length){
    let segs = '';
    for (let i = 0; i < st.total; i++) segs += '<span' + (i < st.done ? ' class="on"' : '') + '></span>';
    html += '<div class="progress-card"><div class="progress-txt"><strong>' + st.done + ' z ' + st.total + ' hotovo</strong><span class="muted">' + st.pct + ' %</span></div>'
      + '<div class="segbar">' + segs + '</div>'
      + '<div class="pc-tools"><button class="linklike" data-action="toggleHide">' + (hide ? '👁 Zobrazit i splněné' : '✓ Skrýt splněné') + '</button></div>'
      + '</div>';
  }

  html += '<div class="toolbar">'
    + '<button class="btn small" data-action="vacAll" aria-label="Hromadné prázdniny" title="Hromadné prázdniny">🏖️</button>'
    + '<button class="btn small' + (editMode ? ' primary' : '') + '" data-action="toggleEdit" aria-label="' + (editMode ? 'Hotovo' : 'Upravit') + '" title="' + (editMode ? 'Hotovo' : 'Upravit') + '">' + (editMode ? '✓' : '✏️') + '</button>'
    + '<button class="btn small" data-action="addHabit" aria-label="Přidat návyk" title="Přidat návyk">＋</button>'
    + '</div>';

  if (!hs.length){
    html += '<div class="card empty">Zatím tu nejsou žádné návyky.<br>Začněte tlačítkem <strong>＋ Přidat návyk</strong>.</div>';
  } else if (editMode){
    html += '<div class="habit-list">' + hs.map((h, i) => editRow(h, i, hs.length)).join('') + '</div>'
      + '<p class="hint">Pořadí změníte přetažením (na počítači) nebo šipkami ↑ ↓. Ikonou 🏖️ nastavíte návyku prázdniny. Podržením prstu na návyku (mimo režim úprav) přidáte poznámku ke dni.</p>';
  } else {
    const hasSections = weekHs.length || biweekHs.length || everyHs.length || monthHs.length;
    if (hide && !shownDay.length && !shownWeek.length && !shownBiweek.length && !shownEvery.length && !shownMonth.length && hiddenCnt){
      html += '<div class="card empty">🎉 Všechno hotovo — splněno ' + hiddenCnt + ' ' + plural(hiddenCnt, 'návyk', 'návyky', 'návyků') + '.</div>';
    } else {
      if (shownDay.length){
        if (hasSections) html += '<div class="sec-title">Denní</div>';
        html += '<div class="habit-list">' + shownDay.map(h => dayRow(h, key, false)).join('') + '</div>';
      } else if (!hide && offCnt){
        html += '<div class="card empty">Na ' + (isToday ? 'dnešek' : 'tento den') + ' nejsou naplánované žádné denní návyky. 🌤️</div>';
      }
      if (shownWeek.length){
        html += '<div class="sec-title">Jednou týdně</div><div class="habit-list">' + shownWeek.map(h => periodicRow(h, key)).join('') + '</div>';
      }
      if (shownBiweek.length){
        html += '<div class="sec-title">Jednou za 2 týdny</div><div class="habit-list">' + shownBiweek.map(h => periodicRow(h, key)).join('') + '</div>';
      }
      if (shownEvery.length){
        html += '<div class="sec-title">V intervalu</div><div class="habit-list">' + shownEvery.map(h => periodicRow(h, key)).join('') + '</div>';
      }
      if (shownMonth.length){
        html += '<div class="sec-title">Jednou měsíčně</div><div class="habit-list">' + shownMonth.map(h => periodicRow(h, key)).join('') + '</div>';
      }
      if (hide && hiddenCnt){
        html += '<p class="hint">Skryto ' + hiddenCnt + ' splněných.</p>';
      }
    }
    if (vacHs.length){
      html += '<details class="vac-card"><summary><span class="vac-emo">🏖️</span>'
        + '<span class="vac-sum"><strong>Na prázdninách</strong><span>' + vacHs.length + ' ' + plural(vacHs.length, 'návyk', 'návyky', 'návyků') + '</span></span>'
        + '<span class="vac-chev">›</span></summary>'
        + '<ul class="vac-list">'
        + vacHs.map(h => '<li><span class="vac-nm">' + habitBadge(h) + ' ' + esc(h.name) + '</span><span class="vac-until">' + (vacUntil(h, selectedDate) ? 'do ' + fmtKeyShort(vacUntil(h, selectedDate)) : 'bez konce') + '</span></li>').join('')
        + '</ul></details>';
    }
  }

  const arch = archivedHabits();
  if (editMode && arch.length){
    html += '<div class="sec-title">Archivované návyky</div><div class="habit-list">'
      + arch.map(h => '<div class="habit-row edit archived" data-id="' + esc(h.id) + '">'
          + habitBadge(h)
          + '<span class="h-main"><span class="h-name">' + esc(h.name) + '</span><span class="h-meta">v archivu</span></span>'
          + '<span class="edit-controls">'
          +   '<button class="icon-btn" data-action="restoreHabit" data-id="' + esc(h.id) + '" aria-label="Obnovit">↩️</button>'
          +   '<button class="icon-btn" data-action="confirmDelete" data-id="' + esc(h.id) + '" data-arch="1" aria-label="Smazat">🗑️</button>'
          + '</span></div>').join('')
      + '</div>';
  }
  $('#view-day').innerHTML = html;
}

/* ============ Render: Kalendář (týden + měsíc) ============ */
function weekHtml(){
  const mon = weekAnchor;
  const hs = activeHabits();
  const t = today();
  let html = '<div class="daynav">'
    + '<button class="icon-btn" data-action="prevWeek" aria-label="Předchozí týden">‹</button>'
    + '<div class="daynav-mid"><div class="daynav-date">' + fmtWeekRange(mon) + '</div>'
    + (sameDay(mon, startOfWeek(t)) ? '<div class="daynav-sub">Tento týden</div>' : '<div class="daynav-sub"><button class="linklike" data-action="thisWeek">Na tento týden</button></div>')
    + '</div>'
    + '<button class="icon-btn" data-action="nextWeek" aria-label="Další týden">›</button>'
    + '</div>';

  if (!hs.length){
    return html + '<div class="card empty">Žádné aktivní návyky.</div>';
  }

  let grid = '<div class="wk-cell name"></div>';
  for (let i = 0; i < 7; i++){
    const d = addDays(mon, i);
    grid += '<button class="wk-cell wk-head' + (sameDay(d, t) ? ' today' : '') + '" data-action="gotoDay" data-key="' + dateKey(d) + '"><span>' + WD[i] + '</span><span class="wk-dnum">' + d.getDate() + '.</span></button>';
  }
  for (const h of hs){
    const f = habitFreq(h);
    const wkOk = f.type === 'weekly' && doneInWeek(h, mon);
    const paused = isPeriodic(h) && periodicPaused(h, mon);
    const nameExtra = isPeriodic(h)
      ? '<span class="wk-hfreq">1×/' + (f.type === 'weekly' ? 'týd' : 'měs') + (wkOk ? ' <span class="wk-okwk">✓</span>' : '') + (paused ? ' 🏖️' : '') + '</span>'
      : '';
    grid += '<div class="wk-cell name" title="' + esc(h.name) + ' — ' + esc(freqLabel(h)) + '">' + habitBadge(h) + '<span class="wk-hname">' + esc(h.name) + nameExtra + '</span></div>';
    for (let i = 0; i < 7; i++){
      const d = addDays(mon, i);
      const key = dateKey(d);
      const future = d > t;
      const vac = !isPeriodic(h) && onVacation(h, d);
      const off = !isPeriodic(h) && !isScheduled(h, d);
      const frz = !off && !future && frozenDay(h, d);
      const vt = vac ? ' title="Prázdniny 🏖️"' : (frz ? ' title="Zmrazeno 🧊 — streak pokračuje"' : '');
      if (h.type === 'check'){
        const on = isDone(h, key);
        grid += '<button class="wk-cell" data-action="cellToggle" data-id="' + esc(h.id) + '" data-key="' + key + '"' + (future ? ' disabled' : '') + vt + ' aria-label="' + esc(h.name) + ' ' + d.getDate() + '.' + (d.getMonth() + 1) + '.">'
          + '<span class="wk-dot' + (on ? ' on' : '') + (off && !on ? ' off' : '') + (frz && !on ? ' frz' : '') + '">' + (on ? '✓' : '') + '</span></button>';
      } else {
        const v = numVal(h, key);
        const on = isDone(h, key);
        const cls = (on ? ' on' : (v > 0 ? ' part' : '')) + (off && !on && v <= 0 ? ' wk-off' : '');
        grid += '<button class="wk-cell" data-action="gotoDay" data-key="' + key + '"' + (future ? ' disabled' : '') + vt + '>'
          + '<span class="wk-num' + cls + (frz && v <= 0 ? ' frz' : '') + '">' + (v > 0 ? fmtNum(v) : (frz ? '•' : '·')) + '</span></button>';
      }
    }
  }
  grid += '<div class="wk-cell name sum">Splněno</div>';
  for (let i = 0; i < 7; i++){
    const d = addDays(mon, i);
    const s = d > t ? null : dayStats(dateKey(d));
    grid += '<div class="wk-cell sum">' + (s ? s.done + '/' + s.total : '–') + '</div>';
  }

  html += '<div class="card grid-card"><div class="wk-scroll"><div class="wk-grid" style="grid-template-columns:minmax(84px,1.3fr) repeat(7,minmax(34px,46px));">' + grid + '</div></div>'
    + '<p class="hint">Ano/ne návyky odškrtnete klepnutím přímo v mřížce, číselné otevřou daný den. Čárkované dny = nenaplánováno nebo prázdniny.</p></div>';
  return html;
}

/* ============ Render: Měsíc ============ */
function monthHtml(){
  const first = monthAnchor;
  const t = today();
  const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const offset = (first.getDay() + 6) % 7;
  let html = '<div class="daynav">'
    + '<button class="icon-btn" data-action="prevMonth" aria-label="Předchozí měsíc">‹</button>'
    + '<div class="daynav-mid"><div class="daynav-date">' + cap(FMT_MONTH.format(first)) + '</div>'
    + (first.getFullYear() === t.getFullYear() && first.getMonth() === t.getMonth()
        ? '<div class="daynav-sub">Tento měsíc</div>'
        : '<div class="daynav-sub"><button class="linklike" data-action="thisMonth">Na tento měsíc</button></div>')
    + '</div>'
    + '<button class="icon-btn" data-action="nextMonth" aria-label="Další měsíc">›</button>'
    + '</div>';

  let cells = WD.map(w => '<div class="hm-wd">' + w + '</div>').join('');
  for (let i = 0; i < offset; i++) cells += '<div class="hm blank"></div>';
  let sumPct = 0, cnt = 0;
  for (let day = 1; day <= days; day++){
    const d = new Date(first.getFullYear(), first.getMonth(), day);
    const key = dateKey(d);
    if (d > t){
      cells += '<div class="hm future">' + day + '</div>';
      continue;
    }
    const s = dayStats(key);
    const extra = data.notes[key] ? '<i class="hm-nd"></i>' : '';
    const tExtra = data.notes[key] ? ' · 📝' : '';
    if (!s.total && activeHabits().length){
      cells += '<button class="hm vacday' + (sameDay(d, t) ? ' today' : '') + '" data-action="gotoDay" data-key="' + key + '" title="' + day + '. ' + (first.getMonth() + 1) + '. — nic naplánováno (prázdniny / volno)' + tExtra + '"><span>' + day + '</span>' + extra + '</button>';
      continue;
    }
    sumPct += s.pct; cnt++;
    let lvl = 'l0';
    if (s.total && s.done){
      lvl = s.pct < 25 ? 'l1' : s.pct < 50 ? 'l2' : s.pct < 75 ? 'l3' : 'l4';
    }
    cells += '<button class="hm ' + lvl + (sameDay(d, t) ? ' today' : '') + '" data-action="gotoDay" data-key="' + key + '" title="' + day + '. ' + (first.getMonth() + 1) + '. — splněno ' + s.done + ' z ' + s.total + ' (' + s.pct + ' %)' + tExtra + '"><span>' + day + '</span>' + extra + '</button>';
  }
  const avg = cnt ? Math.round(sumPct / cnt) : 0;
  html += '<div class="card"><div class="hm-grid">' + cells + '</div>'
    + '<div class="hm-foot"><span class="hm-legend">Méně <i class="hm l0"></i><i class="hm l1"></i><i class="hm l2"></i><i class="hm l3"></i><i class="hm l4"></i> Více</span>'
    + '<span class="hm-avg">Průměr: <strong>' + avg + ' %</strong></span></div>'
    + '<p class="hint">Barva dne odpovídá podílu splněných návyků. Klepnutím den otevřete.</p></div>';
  return html;
}

  const o = opts || {};
  return '<input class="ck-in' + (o.cls ? ' ' + o.cls : '') + '" data-ck="' + path + '" data-w="' + wk + '"'
    + (o.num ? ' inputmode="decimal"' : '')
    + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '')
    + ' maxlength="' + (o.max || 60) + '" value="' + esc(ckGet(wk, path)) + '" aria-label="' + esc(o.lbl || path) + '">';
}

/* ============ Render: Plán ============ */
function planSections(text){
  const dayMap = { 'PONDĚLÍ': 0, 'ÚTERÝ': 1, 'STŘEDA': 2, 'ČTVRTEK': 3, 'PÁTEK': 4, 'SOBOTA': 5, 'NEDĚLE': 6 };
  const dayRe = /^\s*[•\-–—*]*\s*(PONDĚLÍ|ÚTERÝ|STŘEDA|ČTVRTEK|PÁTEK|SOBOTA|NEDĚLE)(?!\p{L})[:\s–—-]*(.*)$/iu;
  const headRe = /^\s*(\p{Extended_Pictographic}(?:[\uFE0F\u200D]|\p{Extended_Pictographic})*)\s*(\S.*)$/u;
  const secs = [];
  let cur = { kind: 'text', lines: [] };
  const push = () => { if (cur.kind !== 'text' || cur.lines.some(l => l.trim())) secs.push(cur); };
  for (const line of String(text).split('\n')){
    let m = line.match(dayRe);
    if (m){
      push();
      cur = { kind: 'day', day: dayMap[m[1].toUpperCase()], sub: (m[2] || '').trim(), lines: [] };
      continue;
    }
    m = line.match(headRe);
    if (m){
      push();
      cur = { kind: 'head', title: line.trim(), lines: [] };
      continue;
    }
    cur.lines.push(line);
  }
  push();
  return secs;
}
function planInline(t){
  let pill = '';
  let m = t.match(/^([^|]{1,14}?)\s*\|\s*(.+)$/);
  if (m){ pill = '<span class="pl-time">' + esc(m[1].trim()) + '</span> '; t = m[2]; }
  let html;
  m = t.match(/^([0-9]+\.\s+)?([^:]{1,30}):\s+(.+)$/);
  if (m && /\p{L}/u.test(m[2])){
    html = (m[1] ? esc(m[1]) : '') + '<strong>' + esc(m[2]) + ':</strong> ' + esc(m[3]);
  } else if ((m = t.match(/^([^:]{1,30}):\s*$/)) && /\p{L}/u.test(m[1])){
    html = '<strong>' + esc(m[1]) + ':</strong>';
  } else {
    html = esc(t);
  }
  return pill + html;
}
function planLineHtml(line){
  if (!line.trim()) return '<div class="pl-sp"></div>';
  let m = line.match(/^\s+\*\s+(.*)$/) || line.match(/^\s*[◦▪]\s+(.*)$/);
  if (m) return '<div class="pl-li sub"><span class="pl-dot">–</span><span class="pl-tx">' + planInline(m[1]) + '</span></div>';
  m = line.match(/^\s*[•\-–*]\s+(.*)$/);
  if (m) return '<div class="pl-li"><span class="pl-dot">•</span><span class="pl-tx">' + planInline(m[1]) + '</span></div>';
  return '<div class="pl-p">' + planInline(line.trim()) + '</div>';
}
function planBodyHtml(text){
  const out = [];
  let blank = false;
  for (const line of String(text).split('\n')){
    if (!line.trim()){ blank = true; continue; }
    if (blank && out.length) out.push('<div class="pl-sp"></div>');
    blank = false;
    out.push(planLineHtml(line));
  }
  return out.join('');
}
function planPrettyHtml(text){
  const secs = planSections(text);
  if (!secs.some(s => s.kind === 'day')){
    return '<div class="card"><div class="plan-text">' + planBodyHtml(text) + '</div></div>';
  }
  const tIdx = weekdayIdx(today());
  let html = '';
  for (const s of secs){
    const body = s.lines.join('\n').replace(/^\n+|\n+$/g, '');
    if (s.kind === 'head'){
      html += '<div class="plan-head">' + esc(s.title) + '</div>';
      if (body) html += '<div class="card"><div class="plan-text">' + planBodyHtml(body) + '</div></div>';
    } else if (s.kind === 'day'){
      const isT = s.day === tIdx;
      html += '<details class="plan-day' + (isT ? ' today' : '') + '"' + (isT ? ' open' : '') + '>'
        + '<summary><span class="day-tag d' + s.day + '">' + WD[s.day] + '</span>'
        + '<span class="plan-day-title">' + esc(s.sub || WDFULL[s.day]) + '</span>'
        + (isT ? '<span class="today-tag">dnes</span>' : '')
        + '<span class="chev">›</span></summary>'
        + (body ? '<div class="plan-body">' + planBodyHtml(body) + '</div>' : '')
        + '</details>';
    } else if (body){
      html += '<div class="card"><div class="plan-text">' + planBodyHtml(body) + '</div></div>';
    }
  }
  return html;
}

/* ============ Export / Import ============ */
function exportData(){
  const json = JSON.stringify(data, null, 2);
  const fname = 'habit-tracker-zaloha-' + dateKey(today()) + '.json';
  try {
    const file = new File([json], fname, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share){
      navigator.share({ files: [file], title: 'Záloha Habit Trackeru' })
        .then(() => toast('Záloha sdílena'))
        .catch(err => { if (!err || err.name !== 'AbortError') downloadExport(json, fname); });
      return;
    }
  } catch (e) {}
  downloadExport(json, fname);
}
function downloadExport(json, fname){
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Záloha byla stažena');
}
function handleImportFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    let obj;
    try { obj = JSON.parse(reader.result); }
    catch (e) { toast('Soubor není platný JSON.', true); return; }
    const err = validateData(obj);
    if (err){ toast('Import zamítnut: ' + err, true); return; }
    pendingImport = normalizeData(obj);
    const nHab = pendingImport.habits.length;
    const nDays = Object.keys(pendingImport.entries).length;
    openModal(
      '<div class="sheet-title">Importovat data?</div>'
      + '<p class="muted">Soubor obsahuje <strong>' + nHab + ' ' + plural(nHab, 'návyk', 'návyky', 'návyků') + '</strong> a záznamy pro <strong>' + nDays + ' ' + plural(nDays, 'den', 'dny', 'dní') + '</strong>.<br>Importem <strong>přepíšete</strong> všechna současná data v tomto zařízení.</p>'
      + '<div class="modal-actions"><button class="btn" data-action="closeModal">Zrušit</button>'
      + '<button class="btn primary" data-action="applyImport">Importovat</button></div>'
    );
  };
  reader.onerror = () => toast('Soubor se nepodařilo přečíst.', true);
  reader.readAsText(file);
}

/* ============ Přesouvání ============ */
function reorderActive(fromIdx, toIdx){
  const act = activeHabits();
  if (fromIdx === toIdx || fromIdx < 0 || toIdx < 0 || fromIdx >= act.length || toIdx >= act.length) return;
  const pool = act.map(h => h.order);
  const moved = act.splice(fromIdx, 1)[0];
  act.splice(toIdx, 0, moved);
  act.forEach((h, i) => { h.order = pool[i]; });
  save();
}
function moveHabit(id, dir){
  const act = activeHabits();
  const i = act.findIndex(h => h.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= act.length) return;
  const tmp = act[i].order;
  act[i].order = act[j].order;
  act[j].order = tmp;
  save();
}

/* ============ Události ============ */
let lpTimer = null, lpConsume = false, lpX = 0, lpY = 0;
function lpClear(){ if (lpTimer){ clearTimeout(lpTimer); lpTimer = null; } }
document.addEventListener('pointerdown', ev => {
  if (editMode || tab !== 'day') return;
  const row = ev.target.closest('#view-day .habit-row');
  if (!row || row.classList.contains('edit')) return;
  if (ev.target.closest('.stepper, .num-input, .tmr, .lnk')) return;
  const id = row.dataset.id;
  if (!id) return;
  lpX = ev.clientX || 0; lpY = ev.clientY || 0;
  lpClear();
  lpTimer = setTimeout(() => {
    lpTimer = null;
    const h = habitById(id);
    if (!h) return;
    lpConsume = true;
    openNoteModal(h, dateKey(selectedDate));
  }, 550);
});
document.addEventListener('pointermove', ev => {
  if (!lpTimer) return;
  const dx = (ev.clientX || 0) - lpX, dy = (ev.clientY || 0) - lpY;
  if (dx * dx + dy * dy > 144) lpClear();
});
document.addEventListener('pointerup', lpClear);
document.addEventListener('pointercancel', lpClear);

document.addEventListener('click', ev => {
  if (lpConsume){ lpConsume = false; ev.stopPropagation(); ev.preventDefault(); return; }
  const el = ev.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const act = el.dataset.action;
  const id = el.dataset.id;

  switch (act){
    case 'tab': {
      tab = el.dataset.tab;
      if (tab === 'cal'){
        weekAnchor = startOfWeek(selectedDate);
        monthAnchor = firstOfMonth(selectedDate);
      }
      render();
      break;
    }
    case 'prevDay': selectedDate = addDays(selectedDate, -1); render(); break;
    case 'nextDay': {
      const n = addDays(selectedDate, 1);
      if (tab === 'meals' || n <= today()) { selectedDate = n; render(); }
      break;
    }
    case 'goToday': selectedDate = today(); render(); break;
    case 'calWeek': calView = 'week'; render(); break;
    case 'calMonth': calView = 'month'; render(); break;
    case 'addSnack': mealSnackUI.n = Math.min(12, mealSnackUI.n + 1); render(); break;
    case 'toggleHide': data.hideDone = !data.hideDone; save(); render(); break;
    case 'openTheme': openThemeModal(); break;
    case 'setThemeBg': data.theme = normTheme({ ...normTheme(data.theme), bg: el.dataset.v }); save(); applyTheme(); openThemeModal(); break;
    case 'setThemeCard': data.theme = normTheme({ ...normTheme(data.theme), card: el.dataset.v }); save(); applyTheme(); openThemeModal(); break;
    case 'setThemeAccent': data.theme = normTheme({ ...normTheme(data.theme), accent: el.dataset.v }); save(); applyTheme(); openThemeModal(); break;
    case 'setThemeText': data.theme = normTheme({ ...normTheme(data.theme), text: el.dataset.v }); save(); applyTheme(); openThemeModal(); break;
    case 'resetTheme': data.theme = { ...THEME_DEFAULT }; save(); applyTheme(); openThemeModal(); break;
    case 'mealHist': openMealHistModal(el.dataset.f); break;
    case 'pickMeal': {
      const f = el.dataset.f;
      const v = el.dataset.v || '';
      const k = dateKey(selectedDate);
      const m = mealObj(k);
      if (f === 'sn'){ m.sn.push(v); }
      else m[f] = v;
      data.meals[k] = { b: m.b, l: m.l, d: m.d, sn: m.sn, note: m.note };
      save(); closeModal(); render();
      toast('Vyplněno z historie');
      break;
    }
    case 'saveNote': {
      const h = habitById(id);
      if (!h) break;
      setNote(el.dataset.key, h.id, ($('#f-note') && $('#f-note').value) || '');
      closeModal(); render();
      toast('Poznámka uložena');
      break;
    }
    case 'delNote': {
      const h = habitById(id);
      if (!h) break;
      setNote(el.dataset.key, h.id, '');
      closeModal(); render();
      toast('Poznámka smazána');
      break;
    }
    case 'startTimer': {
      const h = habitById(id);
      if (!h || !h.timerMin) break;
      startTimer(h, el.dataset.key || dateKey(selectedDate));
      toast('⏱️ ' + h.name + ' — ' + h.timerMin + ' min běží');
      break;
    }
    case 'cancelTimer': stopTimer(); toast('Časovač zrušen'); break;
    case 'openLink': break; // odkaz řeší prohlížeč, jen nesmí přepnout řádek
    case 'ckPrevDay': ckDate = addDays(ckDay(), -1); render(); break;
    case 'ckNextDay': if (ckDay() < today()){ ckDate = addDays(ckDay(), 1); render(); } break;
    case 'ckToday': ckDate = null; render(); break;
    case 'ckChip': {
      const cur = ckGet(el.dataset.w, el.dataset.path);
      ckSet(el.dataset.w, el.dataset.path, cur === el.dataset.v ? '' : el.dataset.v);
      render();
      break;
    }
    case 'exportCheckin': {
      copyPlainText(checkinText(ckWeekKey()), 'checkin-' + ckWeekKey() + '.txt', 'Check-in zkopírován — stačí vložit do zprávy');
      break;
    }
    case 'shopAdd': {
      const inp = $('#shop-new');
      const t = (inp && inp.value || '').trim().slice(0, 120);
      if (!t) break;
      if (data.shopping.items.length >= 100){ toast('Seznam je plný (max 100 položek)', true); break; }
      data.shopping.items.push({ t, done: false });
      save();
      const det = document.querySelector('.shop-card');
      const wasOpen = det ? det.open : true;
      render();
      const d2 = document.querySelector('.shop-card');
      if (d2 && wasOpen){ d2.open = true; const ni = $('#shop-new'); if (ni) ni.focus(); }
      break;
    }
    case 'shopToggle': {
      const it = data.shopping.items[Number(el.dataset.i)];
      if (!it) break;
      it.done = !it.done;
      save();
      const det = document.querySelector('.shop-card');
      const wasOpen = det ? det.open : true;
      render();
      const d2 = document.querySelector('.shop-card');
      if (d2 && wasOpen) d2.open = true;
      break;
    }
    case 'shopDel': {
      data.shopping.items.splice(Number(el.dataset.i), 1);
      save();
      const det = document.querySelector('.shop-card');
      const wasOpen = det ? det.open : true;
      render();
      const d2 = document.querySelector('.shop-card');
      if (d2 && wasOpen) d2.open = true;
      break;
    }
    case 'shopPaste': openShopPasteModal(); break;
    case 'shopPasteAdd': {
      const parsed = parseShopText(($('#shop-paste') && $('#shop-paste').value) || '');
      if (!parsed.length){ toast('Nic k přidání — vlož text seznamu', true); break; }
      data.shopping.items = data.shopping.items.concat(parsed).slice(0, 200);
      save();
      closeModal();
      render();
      const d2 = document.querySelector('.shop-card');
      if (d2) d2.open = true;
      const real = parsed.filter(i => !i.h).length;
      toast('Přidáno ' + real + ' ' + plural(real, 'položka', 'položky', 'položek'));
      break;
    }
    case 'shopClearDone': {
      data.shopping.items = data.shopping.items.filter(i => !i.done);
      save();
      render();
      const d2 = document.querySelector('.shop-card');
      if (d2) d2.open = true;
      toast('Nakoupené smazáno');
      break;
    }
    case 'exportMealsWeek': {
      const txt = mealsWeekText(selectedDate);
      if (navigator.share){
        navigator.share({ title: 'Jídelníček', text: txt })
          .then(() => toast('Jídelníček sdílen'))
          .catch(err => { if (!err || err.name !== 'AbortError') copyMealsWeek(txt); });
      } else copyMealsWeek(txt);
      break;
    }
    case 'gotoDay': {
      let d = parseKey(el.dataset.key);
      if (d > today()) d = today();
      selectedDate = d;
      tab = 'day';
      render();
      break;
    }
    case 'prevWeek': weekAnchor = addDays(weekAnchor, -7); render(); break;
    case 'nextWeek': weekAnchor = addDays(weekAnchor, 7); render(); break;
    case 'thisWeek': weekAnchor = startOfWeek(today()); render(); break;
    case 'prevMonth': monthAnchor = new Date(monthAnchor.getFullYear(), monthAnchor.getMonth() - 1, 1); render(); break;
    case 'nextMonth': monthAnchor = new Date(monthAnchor.getFullYear(), monthAnchor.getMonth() + 1, 1); render(); break;
    case 'thisMonth': monthAnchor = firstOfMonth(today()); render(); break;

    case 'toggleEdit': editMode = !editMode; render(); break;
    case 'addHabit': openHabitModal(null); break;
    case 'editHabit': { const h = habitById(id); if (h) openHabitModal(h); break; }
    case 'confirmDelete': { const h = habitById(id); if (h) openDeleteModal(h, el.dataset.arch === '1'); break; }
    case 'archiveHabit': {
      const h = habitById(id);
      if (h){ h.archived = true; save(); closeModal(); render(); toast('Návyk „' + h.name + '“ byl archivován'); }
      break;
    }
    case 'deleteHabit': {
      const h = habitById(id);
      if (h){
        data.habits = data.habits.filter(x => x.id !== id);
        for (const k of Object.keys(data.entries)){
          delete data.entries[k][id];
          if (!Object.keys(data.entries[k]).length) delete data.entries[k];
        }
        save(); closeModal(); render();
        toast('Návyk „' + h.name + '“ byl smazán');
      }
      break;
    }
    case 'restoreHabit': {
      const h = habitById(id);
      if (h){
        h.archived = false;
        h.order = activeHabits().reduce((m, x) => Math.max(m, x.order), -1) + 1;
        save(); render();
        toast('Návyk „' + h.name + '“ byl obnoven');
      }
      break;
    }
    case 'moveUp': moveHabit(id, -1); render(); break;
    case 'moveDown': moveHabit(id, 1); render(); break;

    case 'rowToggle': {
      const h = habitById(id);
      if (!h) break;
      const key = dateKey(selectedDate);
      const was = isDone(h, key);
      if (!was && isPeriodic(h)){
        const f = habitFreq(h);
        const dk = f.type === 'weekly' ? doneInWeek(h, startOfWeek(selectedDate))
          : f.type === 'biweekly' ? doneInFortnight(h, fortnightStart(selectedDate))
          : f.type === 'monthly' ? doneInMonth(h, firstOfMonth(selectedDate))
          : null; // interval: splnit jde kdykoli, restartuje odpočet
        if (dk && dk !== key){
          toast('„' + h.name + '“ už je splněno — ' + fmtKeyShort(dk) + '. Zrušit to jde jen na tom dni.');
          break;
        }
      }
      setVal(key, h.id, was ? false : true);
      if (!was) popRef = { id: h.id, key };
      render();
      break;
    }
    case 'cellToggle': {
      const h = habitById(id);
      if (!h) break;
      const key = el.dataset.key;
      setVal(key, h.id, isDone(h, key) ? false : true);
      render();
      break;
    }
    case 'inc': case 'dec': {
      const h = habitById(id);
      if (!h || h.type !== 'number') break;
      const key = dateKey(selectedDate);
      const was = isDone(h, key);
      const step = (h.goal && h.goal <= 3) ? 0.5 : 1;
      let v = numVal(h, key) + (act === 'inc' ? step : -step);
      v = Math.max(0, Math.round(v * 100) / 100);
      setVal(key, h.id, v);
      if (!was && isDone(h, key)) popRef = { id: h.id, key };
      render();
      break;
    }

    case 'setType': {
      document.querySelectorAll('#type-seg .seg-btn').forEach(b => b.classList.toggle('on', b === el));
      const gf = $('#goal-fields');
      if (gf) gf.hidden = el.dataset.type !== 'number';
      break;
    }
    case 'setFreq': {
      document.querySelectorAll('#freq-seg .seg-btn').forEach(b => b.classList.toggle('on', b === el));
      const df = $('#days-fields');
      if (df) df.hidden = el.dataset.freq !== 'days';
      const ef = $('#every-fields');
      if (ef) ef.hidden = el.dataset.freq !== 'every';
      break;
    }
    case 'toggleDay': el.classList.toggle('on'); break;
    case 'vacHabit': { const h = habitById(id); if (h) openVacModal(h); break; }
    case 'addVac': {
      const h = habitById(id);
      if (!h) break;
      const r = readVacDates();
      if (!r) break;
      h.vacations = normVacs([...vacList(h), r]);
      save(); render();
      openVacModal(h);
      toast('Prázdniny přidány');
      break;
    }
    case 'delVac': {
      const h = habitById(id);
      if (!h) break;
      h.vacations = vacList(h).filter(v => !(v.from === el.dataset.from && v.to === el.dataset.to));
      save(); render();
      openVacModal(h);
      toast('Prázdniny smazány');
      break;
    }
    case 'vacAll': openVacAllModal(); break;
    case 'applyVacAll': {
      const r = readVacDates();
      if (!r) break;
      const act = activeHabits();
      act.forEach(h => { h.vacations = normVacs([...vacList(h), r]); });
      save(); closeModal(); render();
      toast('Prázdniny ' + fmtKeyShort(r.from) + ' – ' + fmtKeyShort(r.to) + ' nastaveny pro ' + act.length + ' ' + plural(act.length, 'návyk', 'návyky', 'návyků'));
      break;
    }
    case 'endVacAll': {
      const tk = dateKey(today());
      const yk = dateKey(addDays(today(), -1));
      data.habits.forEach(h => {
        if (!Array.isArray(h.vacations)) return;
        h.vacations = h.vacations.map(v => {
          if (v.from <= tk && tk <= v.to){
            if (v.from === tk) return null; // začaly dnes → smazat celé
            return { from: v.from, to: yk }; // jinak ukončit včerejškem
          }
          return v;
        }).filter(Boolean);
      });
      save(); closeModal(); render();
      toast('Probíhající prázdniny ukončeny');
      break;
    }
    case 'editPlan': {
      planEdit = true;
      planDraft = data.plan || '';
      render();
      const ta = $('#plan-ta');
      if (ta) ta.focus();
      break;
    }
    case 'cancelPlan': planEdit = false; render(); break;
    case 'savePlan': {
      const ta = $('#plan-ta');
      data.plan = ((ta ? ta.value : planDraft) || '').slice(0, 50000);
      planEdit = false;
      save(); render();
      toast('Plán uložen');
      break;
    }
    case 'pickEmoji': { const f = $('#f-emoji'); if (f) f.value = el.dataset.emoji; break; }
    case 'saveHabit': {
      const name = ($('#f-name') && $('#f-name').value || '').trim();
      if (!name){ toast('Zadejte název návyku', true); break; }
      const emoji = ($('#f-emoji') && $('#f-emoji').value || '').trim().slice(0, 8);
      const typeBtn = document.querySelector('#type-seg .seg-btn.on');
      const type = typeBtn ? typeBtn.dataset.type : 'check';
      let goal = null, unit = '';
      if (type === 'number'){
        goal = parseNum($('#f-goal') ? $('#f-goal').value : '');
        if (!isFinite(goal) || goal <= 0){ toast('Zadejte platný cíl (číslo větší než 0)', true); break; }
        goal = Math.round(goal * 100) / 100;
        unit = ($('#f-unit') && $('#f-unit').value || '').trim().slice(0, 20);
      }
      const freqBtn = document.querySelector('#freq-seg .seg-btn.on');
      let freq = { type: freqBtn ? freqBtn.dataset.freq : 'daily' };
      if (freq.type === 'days'){
        const days = [...document.querySelectorAll('#days-fields .day-chip.on')].map(b => Number(b.dataset.day));
        if (!days.length){ toast('Vyberte aspoň jeden den v týdnu', true); break; }
        freq.days = days;
      }
      if (freq.type === 'every'){
        if (type === 'number'){ toast('Interval „znovu za X dní" funguje jen u ano/ne návyků', true); break; }
        const ev = parseInt(($('#f-every') && $('#f-every').value || '').trim(), 10);
        if (!isFinite(ev) || ev < 2 || ev > 365){ toast('Zadejte interval 2–365 dní', true); break; }
        freq.days = ev;
      }
      freq = normFreq(freq);
      const tmRaw = ($('#f-timer') && $('#f-timer').value || '').trim();
      const tm = parseInt(tmRaw, 10);
      const timerMin = (tmRaw && isFinite(tm) && tm >= 1 && tm <= 600) ? tm : null;
      if (tmRaw && timerMin === null){ toast('Časovač: zadejte 1–600 minut, nebo nechte prázdné', true); break; }
      const lkRaw = ($('#f-link') && $('#f-link').value || '').trim();
      const link = safeLink(lkRaw);
      if (lkRaw && !link){ toast('Odkaz musí být adresa aplikace nebo webu, např. duolingo:// nebo https://…', true); break; }
      if (id){
        const h = habitById(id);
        if (h){ h.name = name.slice(0, 60); h.emoji = emoji; h.type = type; h.goal = goal; h.unit = unit; h.freq = freq; h.timerMin = timerMin; h.link = link; }
        toast('Návyk upraven');
      } else {
        data.habits.push({
          id: uid(), name: name.slice(0, 60), emoji, type, goal, unit, freq,
          archived: false,
          order: data.habits.reduce((m, x) => Math.max(m, x.order), -1) + 1,
          createdAt: Date.now(),
          vacations: [],
          timerMin,
          link
        });
        toast('Návyk přidán');
      }
      save(); closeModal(); render();
      break;
    }

    case 'syncSetup':
      openModal(
        '<div class="sheet-title">☁️ Nastavit synchronizaci</div>'
        + '<p class="muted" style="margin:0 0 10px;font-size:13.5px">Vložte GitHub token (fine-grained) s právem <strong>Contents: Read and write</strong> jen pro repozitář habit-tracker. Uloží se jen v tomto zařízení a nikdy neopouští appku jinam než na GitHub.</p>'
        + '<label class="field"><span class="field-lbl">GitHub token</span><input id="sync-token" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ghp_…"></label>'
        + '<div class="modal-actions"><button class="btn" data-action="closeModal">Zrušit</button>'
        + '<button class="btn primary" data-action="syncConnect">Připojit</button></div>'
      );
      break;
    case 'syncConnect': {
      const tk = ($('#sync-token') && $('#sync-token').value || '').trim();
      if (!tk){ toast('Vložte token', true); break; }
      closeModal();
      syncConnect(tk);
      break;
    }
    case 'syncPull': syncPull(); break;
    case 'syncPushInit': closeModal(); syncNow().then(() => toast('Data z tohoto zařízení nahrána')); break;
    case 'syncNow': toast('Nahrávám…'); syncNow(); break;
    case 'syncCopyLink': copyPlainText(syncRawUrl(), 'odkaz.txt', 'Odkaz zkopírován — pošli ho Claudovi'); break;
    case 'syncDisconnect': if (window.confirm('Odpojit synchronizaci? Záloha na GitHubu zůstane, jen se přestane obnovovat.')) syncDisconnect(); break;
    case 'exportData': exportData(); break;
    case 'importData': { const f = $('#importFile'); f.value = ''; f.click(); break; }
    case 'applyImport': {
      if (pendingImport){
        data = pendingImport;
        pendingImport = null;
        save();
        selectedDate = today();
        editMode = false;
        closeModal(); render();
        toast('Data byla importována');
      }
      break;
    }
    case 'closeModal': closeModal(); break;
  }
});

document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'importFile'){
    if (el.files && el.files[0]) handleImportFile(el.files[0]);
    return;
  }
  if (el.classList.contains('num-input')){
    const h = habitById(el.dataset.id);
    if (!h) return;
    const key = dateKey(selectedDate);
    const was = isDone(h, key);
    const v = parseNum(el.value);
    if (!isFinite(v) || v < 0){
      render();
      toast('Neplatné číslo', true);
      return;
    }
    setVal(key, h.id, Math.round(v * 100) / 100);
    if (!was && isDone(h, key)) popRef = { id: h.id, key };
    render();
  }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (!t) return;
  if (t.id === 'plan-ta'){ planDraft = t.value; return; }
  if (t.classList && t.classList.contains('ck-in')){
    ckSet(t.dataset.w, t.dataset.ck, t.value);
    return;
  }
  if (t.id === 'shop-note'){
    data.shopping.note = t.value.slice(0, 2000);
    save();
    return;
  }
  if (t.id === 'meal-b' || t.id === 'meal-l' || t.id === 'meal-d' || t.id === 'meal-note' || t.classList.contains('meal-sn')){
    const k = dateKey(selectedDate);
    const m = mealObj(k);
    if (t.id === 'meal-b') m.b = t.value;
    else if (t.id === 'meal-l') m.l = t.value;
    else if (t.id === 'meal-d') m.d = t.value;
    else if (t.id === 'meal-note') m.note = t.value;
    m.sn = [...document.querySelectorAll('#view-meals .meal-sn')].map(x => x.value.slice(0, 500));
    const any = m.b.trim() || m.l.trim() || m.d.trim() || m.note.trim() || m.sn.some(s => s.trim());
    if (any) data.meals[k] = { b: m.b.slice(0, 2000), l: m.l.slice(0, 2000), d: m.d.slice(0, 2000), sn: m.sn, note: m.note.slice(0, 2000) };
    else delete data.meals[k];
    save();
  }
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'shop-new'){
    ev.preventDefault();
    const btn = document.querySelector('[data-action="shopAdd"]');
    if (btn) btn.click();
    return;
  }
  if (ev.key === 'Escape' && $('#modal-root').firstChild){ closeModal(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('habit-row') && ev.target.dataset.action === 'rowToggle'){
    ev.preventDefault();
    ev.target.click();
  }
  if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('num-input')){
    ev.target.blur();
  }
});

/* Drag & drop (počítač) */
document.addEventListener('dragstart', ev => {
  const row = ev.target.closest && ev.target.closest('.habit-row.edit[draggable]');
  if (!row || row.dataset.idx === undefined){ return; }
  dragFrom = Number(row.dataset.idx);
  row.classList.add('dragging');
  if (ev.dataTransfer){ ev.dataTransfer.effectAllowed = 'move'; try { ev.dataTransfer.setData('text/plain', String(dragFrom)); } catch (e) {} }
});
document.addEventListener('dragover', ev => {
  const row = ev.target.closest && ev.target.closest('.habit-row.edit[draggable]');
  if (row && dragFrom !== null){
    ev.preventDefault();
    document.querySelectorAll('.habit-row.drag-over').forEach(r => r.classList.remove('drag-over'));
    if (Number(row.dataset.idx) !== dragFrom) row.classList.add('drag-over');
  }
});
document.addEventListener('drop', ev => {
  const row = ev.target.closest && ev.target.closest('.habit-row.edit[draggable]');
  if (row && dragFrom !== null){
    ev.preventDefault();
    reorderActive(dragFrom, Number(row.dataset.idx));
    dragFrom = null;
    render();
  }
});
document.addEventListener('dragend', () => {
  dragFrom = null;
  document.querySelectorAll('.habit-row.dragging,.habit-row.drag-over').forEach(r => r.classList.remove('dragging', 'drag-over'));
});

/* ============ Toast ============ */
let toastTimer = null;
function toast(msg, isErr){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ============ Hlavní render ============ */
function render(){
  applyTheme();
  const td = document.querySelector('.tab-day');
  if (td) td.textContent = WD[weekdayIdx(today())];
  ['day', 'cal', 'meals', 'stats', 'plan', 'checkin'].forEach(v => { $('#view-' + v).hidden = v !== tab; });
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab === 'day') renderDay();
  else if (tab === 'cal') renderCal();
  else if (tab === 'meals') renderMeals();
  else if (tab === 'plan') renderPlan();
  else if (tab === 'checkin') renderCheckin();
  else renderStats();
  popRef = null;
}

/* Po návratu do aplikace další den se přepni na aktuální datum */
let lastSeen = dateKey(today());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && dateKey(today()) !== lastSeen){
    lastSeen = dateKey(today());
    selectedDate = today();
    weekAnchor = startOfWeek(today());
    monthAnchor = firstOfMonth(today());
    render();
  }
});

/* ============ Start ============ */
storageOk = checkStorage();
data = load();
if (!storageOk) $('#storage-banner').hidden = false;
render();

/* PWA: offline režim přes service worker (jen na webu, lokální soubor nezmění) */
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
