name: Připomínky
 
on:
  schedule:
    - cron: '*/15 * * * *'   # každých 15 minut (GitHub se občas opozdí o pár minut)
  workflow_dispatch:          # ruční spuštění pro test
 
permissions:
  contents: write
 
concurrency:
  group: reminders
  cancel-in-progress: false
 
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install web-push@3.6.7 --no-save --no-audit --no-fund
      - name: Rozeslat naplánovaná oznámení
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
        run: node scripts/send-reminders.js
 
